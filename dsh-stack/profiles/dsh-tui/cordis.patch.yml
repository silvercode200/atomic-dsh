# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Code Mode SDK runtime: dsh-tui 0.10.0-beta.4 mounts its own code-runtime
# entry (dsh-tui-code-runtime) in the package's cordis.patch.yml. Do NOT
# insert #code-runtime here: the bundle layer applies before this profile
# layer, so the package's disabled-guard does not see our entry, both mount,
# and the second registration crashes the boot ("service codeRuntime has been
# registered"). With 0.9.3 the insert was required; with 0.10.0-beta.4 it must
# stay removed.

# Permission: dsh = workspace-write + approval never (no prompts inside cwd).
# dsh+ still uses DSH_PERMISSION_MODE=danger-full-access (set by wrapper).
# Difference between dsh and dsh+ is only the directory scope (cwd vs full).
- id: approval
  config:
    policy: never

# workspace-write + approval=never matches no built-in preset, and
# PermissionPresetService throws at boot ("composed sandbox and approval
# defaults match no preset; configure defaultPreset explicitly"). The presets
# table below replaces the built-in dict wholesale: keep both built-ins and
# add an exact match for our knobs. Without defaultPreset set, each wrapper
# derives its own preset: dsh -> workspace-write-noask, dsh+ ->
# danger-full-access.
- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace and permitted temporary directories; wider retries require approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: Full file access without approval prompts.
      workspace-write-noask:
        sandbox: workspace-write
        approval: never
        name: workspace-write-noask
        description: Write inside the workspace and permitted temporary directories without approval prompts.

# dsh-tui session modes (patch 18 follow-up, 2026-09-13): the built-in
# default/plan/full cycle declares plan mode as plan+read-only+ask — under
# our danger-full-access preset the plan spec NEVER matches deriveModeIndex
# (sandbox stays danger), so channel.mode.plan stays false after /plan on
# and the shift+tab plan toggle (patch 18) could not see the state to turn
# it off. This override redeclares the cycle so the plan spec carries ONLY
# the plan atom (sandbox/approval wildcards) — /plan on flips
# channel.mode.plan to true, the toggle reads it, and the PlanPicker
# currentOn checkmark becomes correct too. The full mode keeps the
# danger+never atoms. NOTE: a patch row replaces the WHOLE config of the
# bundle's dsh-tui row — the six keys below restate the bundle's active
# keys (provider/fullscreen/effort/preset/workspace/sessionId as of
# 0.10.0-beta.4); re-sync on a TUI upgrade.
- id: dsh-tui
  config:
    provider: deepseek-official
    fullscreen: true
    effort: max
    preset: !!js process.env.DSH_TUI_PRESET ?? undefined
    workspace: !!js process.env.DSH_TUI_WORKSPACE_TARGET ?? undefined
    sessionId: !!js process.env.DSH_TUI_RESUME_SESSION ?? process.env.DSH_CC_RESUME_SESSION ?? undefined
    modes:
      - id: default
        plan: false
      - id: plan
        plan: true
      - id: full
        plan: false
        sandbox: danger-full-access
        approval: never

# session-title-llm: maxOutputTokens 64 -> 32 (2026-09-13). The MKS switcher's
# degenerate-response detector exempts short answers only when the client asks
# for max_tokens < 48 (2x its 24-token output threshold). dsh-base's 64 fell
# outside, so every session-title request (long input, ~5-word answer) scored a
# "degenerate response" strike — 3 titles = 15-day penalty block of the whole
# cli group (the 2026-09-12 golden DoS). 32 tokens still fit a 5-word title
# with room to spare (peak observed: ~15 tokens).
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 32
    timeoutMs: 60000

# Lazy MCP: disable the auto-takeover manager (it would hide TaskGate too) and
# instead wire non-permanent servers as explicit lazy servers.
# TaskGate stays a direct stdio client in the machine-wide ~/.dsh/cordis.patch.yml.
# Example paths below — replace with your actual MCP server locations.
- id: mcp-lazy-manager
  disabled: true

- insert:
    - id: mcp-lazy-codegraph
      name: '@yilinxiao/dsh-mcp-lazy'
      config:
        transport: stdio
        serverName: codegraph
        command: /home/user/.dsh/bin/mcp-stderr-to-log
        args: [codegraph, /home/user/.local/bin/codegraph, serve, --mcp, --no-watch]
        autoActivate: false
        releaseOnTurnEnd: true
        schemaDelivery: message
        routingHints: [code graph, codegraph, граф кода, code]

    - id: mcp-lazy-context-mode
      name: '@yilinxiao/dsh-mcp-lazy'
      config:
        transport: stdio
        serverName: context-mode
        command: /home/user/.dsh/bin/mcp-stderr-to-log
        args: [context-mode, /home/user/.nvm/versions/node/v22.23.2/bin/npx, -y, context-mode]
        autoActivate: false
        releaseOnTurnEnd: true
        schemaDelivery: message
        routingHints: [context, sandbox, index, агрегация]

    # Example: replace path with your actual tavily MCP wrapper location
    - id: mcp-lazy-tavily
      name: '@yilinxiao/dsh-mcp-lazy'
      config:
        transport: stdio
        serverName: tavily
        command: /home/user/.dsh/bin/mcp-stderr-to-log
        args: [tavily, /home/user/.local/bin/tavily-mcp-wrapper.sh]
        autoActivate: false
        releaseOnTurnEnd: true
        schemaDelivery: message
        routingHints: [web search, поиск, tavily, search, research]

    # Example: replace path with your actual deep-research server location
    - id: mcp-lazy-deep-research
      name: '@yilinxiao/dsh-mcp-lazy'
      config:
        transport: stdio
        serverName: deep-research
        command: /home/user/.dsh/bin/mcp-stderr-to-log
        args: [deep-research, /usr/bin/python3, /home/user/.local/bin/deep-research-server.py]
        autoActivate: false
        releaseOnTurnEnd: true
        schemaDelivery: message
        routingHints: [deep research, рисёч, research]

    # spot — on-demand discovery of cold tools/skills/lazy-MCP (cache fix,
    # node b1). Registers spot_search/spot_load gate tools + a frozen
    # guidance section; NEVER rewrites tools:sdk. Local plugin: relative
    # path resolves against this profile directory (cordis-plugin-loader
    # supports "./" names via ctx.baseUrl).
    - id: spot
      name: './spot/plugin.mjs'

# NOTE: автокомпакт 125k (thresholdRatio 0.4768) задаётся НЕ здесь —
# активный экземпляр compaction-basic живёт внутри isolate-группы `compaction`
# пресета (~/.dsh/.agent-presets/code-lazy/agent.cordis.yml). Блок уровня
# профиля цеплялся к disabled-копии base и не работал.
