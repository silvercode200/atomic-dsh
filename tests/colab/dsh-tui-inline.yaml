          echo USAGE_TURN_TIMEOUT
          exit 1
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          F=$work/smoke-usage.txt
          ctx=$(grep -cE '⚡|comp [0-9]|ctx' $F || true)
          echo "DETECTOR scenario_smoke: thinking_turn=done usage_turn=done ctx_markers=$ctx expected>=1 (инвариант 8 живой при ~35% заполнении, w180)"
          [ "$ctx" -ge 1 ]
