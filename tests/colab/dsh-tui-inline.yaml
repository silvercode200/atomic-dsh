  # --- Golden: геометрия-фаззинг (канон §1.1 + §1.8 на случайных широтах) ----
  # Никаких хардкод-порогов ширин: инварианты обязаны держаться на ЛЮБОЙ
  # геометрии. 3 уникальные геометрии из сидированного набора (var seed =
  # дата прогона; диапазон канона w 40-240, h 24-60). На узких геометриях
  # ожидаем RED по инварианту 8 (A9: ctx-метрика гибнет на w40-55).
  - name: geometry_fuzz
    steps:
      - run: |
          cat > $work/fuzz-pick.py <<'PYEOF'
          import random, sys
          # Сидированный выбор 3 уникальных геометрий из диапазона канона
          # (w 40-240, h 24-60). argv[1] = сид (var seed); дефолт синхронен
          # var seed — прогон воспроизводим при любом механизме подстановки.
          seed = 20260921
          if len(sys.argv) > 1 and sys.argv[1].isdigit():
              seed = int(sys.argv[1])
          rnd = random.Random(seed)
          geos = []
          while len(geos) < 3:
              g = (rnd.randint(40, 240), rnd.randint(24, 60))
              if g not in geos:
                  geos.append(g)
          for w, h in geos:
              print("{}x{}".format(w, h))
          PYEOF
          python3 $work/fuzz-pick.py $seed > $work/fuzz-geos.txt
          echo "FUZZ_PICKED: $(tr '\n' ' ' < $work/fuzz-geos.txt)"
        timeout: 120
        idempotent: true
        retry: 2
      - run: |
          for G in $(cat $work/fuzz-geos.txt); do
            W=${G%x*}; H=${G#*x}
            tmux resize-window -t $sess -x "$W" -y "$H"; sleep 1.5
            tmux capture-pane -p -t $sess > $swp/fuzz-$G.txt
          done
          tmux resize-window -t $sess -x 47 -y 43; sleep 1
          echo FUZZ_CAPTURED
        timeout: 360
        retry: 2
        idempotent: true
      - run: |
          cat > $work/det-fuzz.py <<'PYEOF'
          import os, re, sys
          SWP = "/root/dsh-live-frames/sweep"
          geos = [l.strip() for l in open("/root/dsh-inline/fuzz-geos.txt") if l.strip()]
          bad = []
          for g in geos:
              path = os.path.join(SWP, "fuzz-{}.txt".format(g))
              if not os.path.exists(path):
                  bad.append((g, "capture_missing"))
                  continue
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              # Инвариант 1: ровно одна непустая строка ниже рамки ввода.
              bottoms = [i for i, l in enumerate(lines) if "╰" in l]
              below = [l for l in lines[bottoms[-1] + 1:] if l.strip()] if bottoms else []
              single = len(below) == 1
              # Инвариант 8: минимум model (глиф ✦) + ctx-метрика (⚡/comp/ctx).
              text = "\n".join(lines)
              model = bool(re.search(r"✦|glm|claude|opus", text))
              ctx = bool(re.search(r"⚡|comp [0-9]|ctx", text))
              print("DETECTOR fuzz_geometry_{}: single_line={} model={} ctx={}".format(g, single, model, ctx))
              if not single:
                  bad.append((g, "invariant1_rows_below_input={}".format(len(below))))
              if not model:
                  bad.append((g, "invariant8_model_lost"))
              if not ctx:
                  bad.append((g, "invariant8_ctx_lost"))
          print("DETECTOR geometry_fuzz: violations={} geos={} (канон 1+8 на случайных геометриях; сид в fuzz-geos.txt)".format(len(bad), " ".join(geos)))
          for g, why in bad:
              print("  {} {}".format(g, why))
          sys.exit(0 if not bad else 1)
          PYEOF
          python3 $work/det-fuzz.py
        timeout: 120
        idempotent: true
        retry: 2

  # --- Golden: smoke расширенной фейк-модели (thinking-паузы, usage-числа) ---
