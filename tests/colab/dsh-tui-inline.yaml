  # --- Golden: карточки субагентов после двух волн (канон §3, паттерн A8) ----
  # SCENARIO:subagents = 2 реальных спавна (tool subagent, run_in_background:
  # false) -> в скроллбеке две карточки с ЦЕЛЫМИ полями:
  # 'Subagent: <desc> · <model> · <Ns> · <N tok> · <N tools> · completed'.
  # Широкая геометрия 180×50 — поля не усечены (усечение тестирует атлас).
  - name: cards_render
    steps:
      - run: |
          # base = сколько completed-карточек УЖЕ в скроллбеке до хода
          # (идемпотентность retry: карточки прошлой попытки не в счёт).
          tmux resize-window -t $sess -x 180 -y 50; sleep 1.5
          tmux capture-pane -p -S -2000 -t $sess | { grep -cE 'Subagent: .*completed|Субагент: .*completed' > $work/cards-base.txt || true; }; true
          tmux send-keys -t $sess "SCENARIO:subagents запусти две волны субагентов" Enter
          echo CARDS_SENT
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          # Ждём ЗАВЕРШЕНИЯ обеих волн: base+2 completed-карточек в скроллбеке.
          # Прежний выход «первый прирост ●» срабатывал в СЕРЕДИНЕ хода
          # (thinking+текст1; ● — маркер текста, не конца) — захват на 3с
          # волны-2 давал честный RED cards_total=1 (w2i2s2; см.
          # reports/statusbar-fix-20260919/CARDS-VERDICT.md: тайминг, не
          # баг — цикл волн завершается ~13с, карточки добирают
          # completed). Волны синхронные: 2 completed-карточки = обе волны
          # завершились. Карточка волны завершается ~6с; 60×2с с запасом.
          base=$(cat $work/cards-base.txt)
          for w in $(seq 1 60); do
            tmux capture-pane -p -S -2000 -t $sess > $work/cards-frame.txt
            n=$(grep -cE 'Subagent: .*completed|Субагент: .*completed' $work/cards-frame.txt || true)
            if [ "$n" -ge $((base + 2)) ]; then
              tmux capture-pane -p -t $sess > $work/cards-done.txt
              echo CARDS_TURN_DONE
              exit 0
            fi
            sleep 2
          done
          tmux capture-pane -p -t $sess > $work/cards-done.txt
          echo CARDS_TURN_TIMEOUT
          exit 0
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          sleep 1
          tmux capture-pane -p -S -2000 -t $sess > $work/cards-frame.txt
          tmux resize-window -t $sess -x 47 -y 43; sleep 1
          echo CARDS_CAPTURED
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          cat > $work/det-cards.py <<'PYEOF'
          import sys
          FRAME = "/root/dsh-inline/cards-frame.txt"
          lines = open(FRAME, encoding="utf-8", errors="replace").read().splitlines()
          # Паттерн A8: 'Subagent: <desc> · <model> · <Ns> · <N tok> · <N tools> · completed'
          # Целая карточка = префикс + >=5 непустых полей по ' · ' + статус completed.
          cards = []
          for l in lines:
              if ("Subagent: " in l or "Субагент: " in l) and "completed" in l:
                  fields = [f.strip() for f in l.split("·")]
                  nonempty = [f for f in fields if f]
                  cards.append((len(nonempty), l.strip()[:140]))
          intact = [c for c in cards if c[0] >= 5]
          print("DETECTOR cards_render: cards_total={} intact={} expected_intact>=2 (две волны, поля целиком, статус completed)".format(len(cards), len(intact)))
          for n, l in cards[:8]:
              print("  card fields={} line={!r}".format(n, l))
          sys.exit(0 if len(intact) >= 2 else 1)
          PYEOF
          python3 $work/det-cards.py
        timeout: 240
        retry: 2
        idempotent: true

  # --- Golden C5: видимость фазы компакции [ОЖИДАЕМ RED — БАГ ОТКРЫТ] -------
  # Канон §3 Компакция: фаза видима (спиннер/строка Compacting), завершение
  # строкой. Сейчас: toast «Compacting conversation…» с timeoutMs=4000 при
  # окне ~45-50с (fake: delayMs 4с + repeatMs 45с) -> десятки секунд тишины.
  # Детектор меряет кадры ПОСЛЕ смерти тоста (t>=5с из серии 0.5с x 24):
  # фаза обязана быть видима в середине окна. RED здесь = честный открытый
  # канон-пункт C5, НЕ инфра-фейл; routing-строка показывает, какой сценарий
  # реально обслужил compaction-запрос (лог fake-сервера на VM).
  - name: compact_visible
    steps:
      - run: |
          tmux resize-window -t $sess -x 47 -y 43; sleep 1.5
          tmux send-keys -t $sess C-c; sleep 0.5
          # База compact-записей в логе fake-сервера, ПО ВСЕМ файлам (дневная
          # ротация не рвёт монотонность счёта). Запись пишется сервером в
          # момент КОНЦА запроса (server.mjs: log() после стрима) — прирост
          # счётчика = завершившийся ход.
          cat /root/dsh-fake-llm/logs/server-*.jsonl 2>/dev/null | grep -c '"scenario":"compact"' > $work/compact-cbase.txt || echo 0 > $work/compact-cbase.txt
          tmux send-keys -t $sess "SCENARIO:compact подготовь резюме диалога" Enter
          echo COMPACT_MARKER_SENT
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          # Маркер-turn ~49с (delayMs 4с + стрим 45с): ждём РЕАЛЬНОГО конца
          # хода, а не первый чанк. Прежний критерий «● > base» срабатывал на
          # первом ● стрима (~4с): /compact уходил в veto «Cannot compact
          # while a turn is running» (прогон w3v58s) и патч 58 вообще не
          # проверялся. Сигнал конца = compact-записей в логе больше базы.
          cbase=$(cat $work/compact-cbase.txt)
          for w in $(seq 1 80); do
            n=$(cat /root/dsh-fake-llm/logs/server-*.jsonl 2>/dev/null | grep -c '"scenario":"compact"' || true)
            [ -z "$n" ] && n=0
            if [ "$n" -gt "$cbase" ]; then
              sleep 3   # финальный рендер ответа в TUI после конца стрима
              echo COMPACT_MARKER_DONE
              exit 0
            fi
            sleep 2
          done
          echo COMPACT_MARKER_TIMEOUT
          exit 0
        timeout: 240
        retry: 2
        idempotent: true
      - run: |
          # /compact ПОСЛЕ реального конца хода + серия живых кадров 0.5с x 24
          # (~13с). Тост умирает на ~4с; зона t>=5с = окно проверки фазы (C5).
          # Сама компакция стримится до ~49с.
          tmux send-keys -t $sess /compact; sleep 0.3; tmux send-keys -t $sess Enter
          I=0
          while [ $I -lt 24 ]; do
            I=$((I+1))
            tmux capture-pane -p -t $sess > $work/compact-f-$(printf '%02d' $I).txt
            sleep 0.5
          done
          echo COMPACT_SERIES_DONE
        timeout: 240
        idempotent: true
        retry: 2
      - run: |
          # Дождаться конца компакции (~49с от /compact): кадр байт-стабилен
          # (тикер фазы/тост погасли) — пост-кадр как evidence «завершение
          # строкой» (инфо, не гейт). До 58 тикера нет: после смерти тоста кадр
          # статичен сразу — тоже честный SETTLED. Серию кадров складываем в
          # $frames/compact — драйвер выгрузит их в отчёт.
          prev=""
          for w in $(seq 1 60); do
            tmux capture-pane -p -t $sess > $work/compact-check.txt
            cur=$(md5sum < $work/compact-check.txt | cut -d' ' -f1)
            if [ -n "$prev" ] && [ "$cur" = "$prev" ]; then
              cp $work/compact-check.txt $work/compact-after.txt
              echo COMPACT_SETTLED
              break
            fi
            prev="$cur"
            sleep 2
          done
          if [ ! -f $work/compact-after.txt ]; then
            tmux capture-pane -p -t $sess > $work/compact-after.txt
            echo COMPACT_SETTLE_TIMEOUT
          fi
          mkdir -p $frames/compact
          cp $work/compact-f-*.txt $work/compact-after.txt $frames/compact/ 2>/dev/null || true
          echo COMPACT_EVIDENCE_STAGED
          exit 0
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          cat > $work/det-compact.py <<'PYEOF'
          import glob, json, re, sys
          W = "/root/dsh-inline"
          frames = sorted(glob.glob(W + "/compact-f-*.txt"))
          # Индикация фазы: строка Compacting / слово compact / braille-спиннер.
          IND = re.compile(r"Compacting|ompact|[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]")
          toast_hits, mid_hits = [], []
          for i, f in enumerate(frames, 1):
              t = i * 0.5
              data = open(f, encoding="utf-8", errors="replace").read()
              if IND.search(data):
                  (mid_hits if t >= 5.0 else toast_hits).append(t)
          # Routing-диагностика: честный прогон <=> компакт-записей стало +2
          # к базе (маркер-turn + сам compaction-запрос). Запись пишется в
          # момент КОНЦА запроса, поэтому на RED-пути (детектор стартует до
          # конца компакции) own_run=1 — норма, не провал маршрутизации.
          route = "no server log"
          try:
              cbase = int(open(W + "/compact-cbase.txt").read().strip() or 0)
          except (OSError, ValueError):
              cbase = -1
          try:
              comp_all = []
              for lf in sorted(glob.glob("/root/dsh-fake-llm/logs/server-*.jsonl")):
                  for line in open(lf, encoding="utf-8", errors="replace"):
                      try:
                          e = json.loads(line)
                      except ValueError:
                          continue
                      if e.get("scenario") == "compact":
                          comp_all.append(e)
              if comp_all:
                  own = (len(comp_all) - cbase) if cbase >= 0 else -1
                  last = comp_all[-1]
                  route = "compact_all={} own_run={} last: stream={} duration_ms={} marker={}".format(
                      len(comp_all), own, last.get("stream"), last.get("duration_ms"), last.get("marker"))
              else:
                  route = "compact_all=0 (ни один запрос не ушёл в compact-сценарий)"
          except OSError as e:
              route = "log_unavailable: {}".format(e)
          print("DETECTOR compact_visible: frames={} toast_window_hits={} mid_window_hits={} expected_mid>=1 (фаза видима ПОСЛЕ смерти тоста 4с; GREEN после 58: тикер «⠋ Compacting… Ns»)".format(len(frames), len(toast_hits), len(mid_hits)))
          print("  toast_window(t<5s)={} mid_window(t>=5s)={} routing: {}".format(toast_hits, mid_hits, route))
          sys.exit(0 if len(mid_hits) >= 1 else 1)
          PYEOF
          python3 $work/det-compact.py
        timeout: 120
        idempotent: true
        retry: 2

  # --- Обрыв хода по лимиту токенов + авто-продолжение (волна 4 D-b, core 07) --
  - name: stream_stall
    steps:
      - run: |
          tmux resize-window -t $sess -x 47 -y 43; sleep 1.5
          tmux send-keys -t $sess C-c; sleep 0.5
          # База maxtokens-записей в логе fake-сервера (как compact: запись
          # пишется в момент КОНЦА запроса; прирост = завершившийся ответ).
          cat /root/dsh-fake-llm/logs/server-*.jsonl 2>/dev/null | grep -c '"scenario":"maxtokens"' > $work/stall-cbase.txt || echo 0 > $work/stall-cbase.txt
          touch $work/stall-t0.marker
          tmux send-keys -t $sess "SCENARIO:maxtokens проверь продолжение после лимита токенов" Enter
          # Живая серия кадров 0.5с x 16 (~8с): окно хода — обрыв (~1-4с:
          # delayMs 1с + стрим ~2с) и авто-продолжение (~4-8с). GREEN-ход
          # (обрыв MAXTOKENS_CUT + continue + хвост MAXTOKENS_TAIL) целиком
          # внутри серии; серию складываем в $frames/stall.
          I=0
          while [ $I -lt 16 ]; do
            I=$((I+1))
            tmux capture-pane -p -t $sess > $work/stall-f-$(printf '%02d' $I).txt
            sleep 0.5
          done
          echo STALL_MARKER_SENT
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          # Фаза A: обрыв стримится и ЗАВЕРШИЛСЯ — maxtokens-записей стало
          # больше базы (первый ответ хода, со stop_reason max_tokens).
          mtbase=$(cat $work/stall-cbase.txt)
          for w in $(seq 1 40); do
            n=$(cat /root/dsh-fake-llm/logs/server-*.jsonl 2>/dev/null | grep -c '"scenario":"maxtokens"' || true)
            [ -z "$n" ] && n=0
            if [ "$n" -gt "$mtbase" ]; then
              echo STALL_CUT_DONE
              exit 0
            fi
            sleep 2
          done
          echo STALL_CUT_TIMEOUT
          exit 0
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          # Фаза B: ждём ВТОРОЙ maxtokens-запрос (продолжение хода) — GREEN
          # core 07 шлёт синтетическое continue тем же ходом. RED (простой
          # стек): прироста нет — счёт стоит на базе+1, стабильность 8 тиков
          # (~16с) = честный RED-путь, идём собирать evidence для детектора.
          mtbase=$(cat $work/stall-cbase.txt)
          prev=-1; stable=0
          for w in $(seq 1 60); do
            n=$(cat /root/dsh-fake-llm/logs/server-*.jsonl 2>/dev/null | grep -c '"scenario":"maxtokens"' || true)
            [ -z "$n" ] && n=0
            tmux capture-pane -p -t $sess > $work/stall-p2-$(printf '%02d' $w).txt
            if [ "$n" -ge $((mtbase + 2)) ]; then
              sleep 3
              echo STALL_RESUME_DONE
              exit 0
            fi
            if [ "$n" = "$prev" ]; then stable=$((stable+1)); else stable=0; fi
            prev=$n
            if [ "$n" -ge $((mtbase + 1)) ] && [ "$stable" -ge 8 ]; then
              echo STALL_NO_RESUME_RED
              exit 0
            fi
            sleep 2
          done
          echo STALL_POLLB_TIMEOUT
          exit 0
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          # Evidence: финальный кадр, скроллбек -S -2000 и сессионный лог dsh
          # (session.jsonl.zstd, тронутый после t0-маркера). Событие
          # agent/max-tokens-continue и текст ответа живут в сессии — это
          # авторитетный источник детектора.
          sleep 3
          tmux capture-pane -p -t $sess > $work/stall-final.txt
          tmux capture-pane -p -t $sess -S -2000 > $work/stall-scrollback.txt
          # Декод python3-zstandard (0.25.0 на VM), MULTI-FRAME: dsh пишет
          # события АППЕНДОМ отдельных zstd-фреймов — прежний node:zlib
          # zstdDecompressSync декодировал только первый фрейм = заголовок
          # сессии (163 байта из 142К файла; w4green2: continue_events=0
          # при живом auto-continue — ложный RED). Полный поток =
          # stream_reader(read_across_frames) — тот же контракт, что у
          # стримингового createZstdDecompress в dsh-session-persistence-jsonl.
          cat > $work/stall-decode.py <<'DECEOF'
          import os, sys, zstandard
          dctx = zstandard.ZstdDecompressor()
          parts = []
          for f in sys.argv[1:]:
              if f.endswith(".zstd"):
                  with open(f, "rb") as fh:
                      parts.append(dctx.stream_reader(fh, read_across_frames=True).read())
              else:
                  parts.append(open(f, "rb").read())
          open(os.environ["OUT"], "wb").write(b"".join(parts))
          print("SESSION_DECODED files=%d" % len(sys.argv[1:]))
          DECEOF
          sf=$(find /root/.dsh/sessions -type f \( -name 'session.jsonl.zstd' -o -name 'session.jsonl' \) -newer $work/stall-t0.marker 2>/dev/null | sort)
          if [ -z "$sf" ]; then
            sf=$(find /root/.dsh/sessions -type f \( -name 'session.jsonl.zstd' -o -name 'session.jsonl' \) 2>/dev/null | xargs -r ls -t 2>/dev/null | head -2)
          fi
          if [ -n "$sf" ]; then
            OUT=$work/stall-session.jsonl python3 $work/stall-decode.py $sf
          else
            echo SESSION_LOG_NOT_FOUND
          fi
          mkdir -p $frames/stall
          cp $work/stall-f-*.txt $work/stall-p2-*.txt $work/stall-final.txt $work/stall-scrollback.txt $frames/stall/ 2>/dev/null || true
          echo STALL_EVIDENCE_STAGED
          exit 0
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          cat > $work/det-stall.py <<'PYEOF'
          import glob, json, sys
          W = "/root/dsh-inline"
          # Routing-диагностика: свои maxtokens-запросы прогона (после базы).
          try:
              base = int(open(W + "/stall-cbase.txt").read().strip() or 0)
          except (OSError, ValueError):
              base = -1
          mt_all = []
          for lf in sorted(glob.glob("/root/dsh-fake-llm/logs/server-*.jsonl")):
              for line in open(lf, encoding="utf-8", errors="replace"):
                  try:
                      e = json.loads(line)
                  except ValueError:
                      continue
                  if e.get("scenario") == "maxtokens":
                      mt_all.append(e)
          own = mt_all[base:] if base >= 0 else mt_all
          stops = [str(e.get("stop_reason")) for e in own]
          route = "maxtokens_all={} own_run={} stops={}".format(len(mt_all), len(own), stops)
          # Сессионный лог dsh: событие auto-continue + маркеры текста ответа.
          cont_events = 0
          cut_in_session = False
          tail_in_session = False
          try:
              for line in open(W + "/stall-session.jsonl", encoding="utf-8", errors="replace"):
                  if '"agent/max-tokens-continue"' in line:
                      cont_events += 1
                  if "MAXTOKENS_CUT" in line:
                      cut_in_session = True
                  if "MAXTOKENS_TAIL" in line:
                      tail_in_session = True
          except OSError:
              pass
          # Скроллбек (инфо): хвост на экране (может резаться переносом строк).
          try:
              sb = open(W + "/stall-scrollback.txt", encoding="utf-8", errors="replace").read()
              tail_in_sb = "MAXTOKENS_TAIL" in sb
          except OSError:
              tail_in_sb = False
          print("DETECTOR stream_stall: requests={} continue_events={} cut_in_session={} tail_in_session={} tail_in_scrollback={}".format(
              len(own), cont_events, cut_in_session, tail_in_session, tail_in_sb))
          print("  routing: {} | GREEN после core 07: обрыв + continue + хвост за ОДИН ход".format(route))
          # Гейты (волна 4 D-b): >=2 maxtokens-запроса (обрыв + продолжение),
          # событие agent/max-tokens-continue в сессионном логе dsh, хвост-маркер
          # в тексте ответа сессии. RED до core 07: ход умирает на обрыве
          # (1 запрос, 0 событий, хвост не доезжает).
          sys.exit(0 if (len(own) >= 2 and cont_events >= 1 and tail_in_session) else 1)
          PYEOF
          python3 $work/det-stall.py
        timeout: 120
        idempotent: true
        retry: 2

  # --- v6: гейт анимаций (animations off, патч 66) ---------------------------
  # Двухслойный гейт. Слой 1 — node-ассерт на задеплоенном пакете:
  # normalizeAnimationsStyle(false) обязан вернуть 'off' (boolean-форма
  # из юзерского settings.yaml; до патча 66 boolean молча отбрасывался →
  # undefined → mode 'full' → дыхание рамки ~16 fps, memory
  # dsh-animations-boolean-ignored). Слой 2 — поведенческий: 0 кадров
  # cause='animation' в IDLE-окне трейса (ClockContext.tick; таймер хода
  # и спиннер легитимно тикают ТОЛЬКО во время работы). Idle-гейт: ход
  # завершён самим stream_stall (records=base+2 / RED-смерть), C-c гасит
  # остатки, ●-счёт стабилен 3 тика — нового хода нет. Resize-пульс в
  # середине окна (+1/-1 строка) = гейт живости рендера: кадры обязаны
  # быть (cause='resize', НЕ 'animation'), иначе «0 animation» вакуумен.
  - name: animations_gate
    steps:
      - run: |
          cat > $work/anim-gate.mjs <<'MJSEOF'
          import { readFileSync } from 'node:fs';
          const profile = readFileSync('/root/.dsh-live-target', 'utf8').trim();
          const pkg = 'file:///root/.dsh/profiles/' + profile + '/node_modules/@deepseek-harness-tui/dsh-tui/lib/types/tuiDisplayPrefs.js';
          const mod = await import(pkg);
          const got = mod.normalizeAnimationsStyle(false);
          console.log('ANIM_NORMALIZE false -> ' + JSON.stringify(got));
          process.exit(got === 'off' ? 0 : 1);
          MJSEOF
          if command -v node >/dev/null 2>&1; then
            node $work/anim-gate.mjs > $work/anim-node-out.txt 2>&1
            echo $? > $work/anim-node-rc.txt
          else
            echo 2 > $work/anim-node-rc.txt
            echo 'node binary not found on VM' > $work/anim-node-out.txt
          fi
          cat $work/anim-node-out.txt
          cat $work/anim-node-rc.txt
          echo ANIM_NODE_ASSERT_RUN
          exit 0
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          # Idle-окно: C-c → ●-счёт стабилен 3 тика (6с без нового хода) →
          # t0 → пульс resize → t1. Кадры окна: только resize-причины.
          tmux send-keys -t $sess C-c; sleep 2
          base=$(tmux capture-pane -p -S -2000 -t $sess | grep -c '●' || true)
          stable=0
          for w in $(seq 1 10); do
            sleep 2
            n=$(tmux capture-pane -p -S -2000 -t $sess | grep -c '●' || true)
            if [ "$n" = "$base" ]; then
              stable=$((stable+1))
            else
              stable=0; base=$n
            fi
            if [ "$stable" -ge 3 ]; then break; fi
          done
          echo "$stable" > $work/anim-idle.txt
          date -u +%Y-%m-%dT%H:%M:%SZ > $work/anim-t0.marker
          cat $work/anim-t0.marker
          W=$(tmux display-message -p -t $sess '#{window_width}')
          H=$(tmux display-message -p -t $sess '#{window_height}')
          sleep 3
          tmux resize-window -t $sess -x "$W" -y "$((H+1))"; sleep 2
          tmux resize-window -t $sess -x "$W" -y "$H"; sleep 5
          date -u +%Y-%m-%dT%H:%M:%SZ > $work/anim-t1.marker
          cat $work/anim-t1.marker
          tmux display-message -p -t $sess '#{pane_dead} #{pane_current_command}' > $work/anim-alive.txt
          tmux capture-pane -p -t $sess > $work/anim-idle-frame.txt
          echo ANIM_WINDOW_DONE
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          mkdir -p $frames/anim
          cp $work/anim-gate.mjs $work/anim-node-out.txt $work/anim-node-rc.txt \
             $work/anim-idle.txt $work/anim-t0.marker $work/anim-t1.marker \
             $work/anim-alive.txt $work/anim-idle-frame.txt $frames/anim/ 2>/dev/null || true
          stable=$(cat $work/anim-idle.txt 2>/dev/null || echo 0)
          if [ "$stable" -lt 3 ]; then
            echo "DETECTOR animations_gate: FAIL (idle не доказан: ●-счёт не стабилен 3 тика — ход жив после C-c, окно загрязнено; инфра-условие, НЕ продукт-RED)"
            exit 2
          fi
          dead=$(awk '{print $1}' $work/anim-alive.txt)
          cmd=$(awk '{print $2}' $work/anim-alive.txt)
          if [ "$dead" != "0" ] || [ "$cmd" != "node" ]; then
            echo "DETECTOR animations_gate: FAIL (TUI мёртв: pane_dead=$dead cmd=$cmd — инфра-условие, НЕ продукт-RED)"
            exit 2
          fi
          node_rc=$(cat $work/anim-node-rc.txt)
          if [ "$node_rc" = "2" ]; then
            echo "DETECTOR animations_gate: FAIL (node недоступен на VM — инфра-условие, НЕ продукт-RED)"
            exit 2
          fi
          if [ "$node_rc" != "0" ]; then
            if grep -q 'ANIM_NORMALIZE' $work/anim-node-out.txt; then
              echo "DETECTOR animations_gate: FAIL ($(cat $work/anim-node-out.txt) — boolean-форма appearance.animations игнорируется, ожидание 'off'; продукт-RED до патча 66)"
              exit 1
            fi
            echo "DETECTOR animations_gate: FAIL (mjs упал без ANIM_NORMALIZE — import/путь пакета: $(head -2 $work/anim-node-out.txt); инфра-условие, НЕ продукт-RED)"
            exit 2
          fi
          T0=$(cat $work/anim-t0.marker)
          T1=$(cat $work/anim-t1.marker)
          python3 $work/trace-metrics.py --trace "$work/geo.jsonl*" \
            --from "$T0" --to "$T1" --metric anim --expect clean \
            --require-frames 1 --detector-name animations_gate
        timeout: 120
        idempotent: true
        retry: 2

  # --- v6/v7: пила scrollHeight при ручном скролле (патч 67) ------------------
  # Репродукция юзер-репорта 2026-09-25: скролл колесом от дна (sticky=false)
  # и обратно — экран «мигает и дёргается», scrollHeight осциллирует 39↔42
  # (memory dsh-scroll-height-saw-jitter: 20 флипов/15с, юзер-трейс 24.09
  # 20:56 UTC — 10 флипов 42→39 за минуту окна; локально доказано
  # trace-metrics.py --expect dirty на этом же трейсе). Колесо = SGR-байты
  # через tmux send-keys -H: 64=вверх, 65=вниз; inline без alt-screen гоняет
  # их через legacy input-путь (parse-keypress SGR_MOUSE_RE → App.js
  # onWheelAt → dispatchWheelAt=false → Chat.js wheel-ветка → scrollBy(±3)).
  # Контент: стрим SCENARIO:long ~20с (пул long.json циклится до
  # STREAM_TOTAL_MS=150с, C-c обязателен) + вся история сессии.
  # v7 INLINE-контракт (run2 root-cause, блок в шапке): в inline вьюпорт =
  # контенту (maxScroll=0), гейт 67 глотает колесо у дна как visual no-op —
  # кадров/sticky_off/пилы в окне быть НЕ должно, а НЕ-сработавший транспорт
  # ловится позитивными гейтами (a) mouse-debug 'wheel arrive' >=30 и
  # (b) aliveness >=50 кадров [t_stream..t0] — оба exit 2 инфра; продукт-RED
  # только sticky_off>0/saw_flips>0 (--forbid-sticky-off).
  - name: scroll_jitter
    steps:
      - run: |
          tmux resize-window -t $sess -x 180 -y 50; sleep 1.5
          tmux send-keys -t $sess C-c; sleep 1
          tmux send-keys -t $sess "SCENARIO:long подробный рассказ для скролла" Enter
          date -u +%Y-%m-%dT%H:%M:%SZ > $work/saw-ts.marker
          echo SAW_CONTENT_SENT
        timeout: 120
        retry: 2
        idempotent: true
      - run: |
          # ~20с стрима (контент копится), C-c, settle: ●-стабильность и
          # пауза — спиннер/прерывание хода завершаются за секунды.
          sleep 20
          tmux send-keys -t $sess C-c; sleep 2
          base=$(tmux capture-pane -p -S -2000 -t $sess | grep -c '●' || true)
          stable=0
          for w in $(seq 1 10); do
            sleep 2
            n=$(tmux capture-pane -p -S -2000 -t $sess | grep -c '●' || true)
            if [ "$n" = "$base" ]; then
              stable=$((stable+1))
            else
              stable=0; base=$n
            fi
            if [ "$stable" -ge 3 ]; then break; fi
          done
          echo "$stable" > $work/saw-stable.txt
          sleep 3
          echo SAW_IDLE_REACHED
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          # Окно скролла: t0 → 24× колесо-вверх (SGR 64;24;20M, 0.15с) →
          # удержание 3с → 26× колесо-вниз (SGR 65;24;20M, 0.1с) → t1.
          date -u +%Y-%m-%dT%H:%M:%SZ > $work/saw-t0.marker
          cat $work/saw-t0.marker
          sleep 2
          for I in $(seq 1 24); do
            tmux send-keys -H -t $sess 1b 5b 3c 36 34 3b 32 34 3b 32 30 4d
            sleep 0.15
          done
          sleep 3
          for I in $(seq 1 26); do
            tmux send-keys -H -t $sess 1b 5b 3c 36 35 3b 32 34 3b 32 30 4d
            sleep 0.1
          done
          sleep 3
          date -u +%Y-%m-%dT%H:%M:%SZ > $work/saw-t1.marker
          cat $work/saw-t1.marker
          tmux capture-pane -p -t $sess > $work/saw-final.txt
          tmux capture-pane -p -S -2000 -t $sess > $work/saw-scrollback.txt
          echo SAW_WINDOW_DONE
        timeout: 180
        retry: 2
        idempotent: true
      - run: |
          mkdir -p $frames/scroll
          cp $work/saw-t0.marker $work/saw-t1.marker $work/saw-ts.marker $work/saw-stable.txt \
             $work/saw-final.txt $work/saw-scrollback.txt $frames/scroll/ 2>/dev/null || true
          for f in $work/geo.jsonl*; do
            [ -e "$f" ] || continue
            gzip -c "$f" > $frames/scroll/$(basename "$f").gz
          done
          dead=$(tmux display-message -p -t $sess '#{pane_dead}')
          if [ "$dead" != "0" ]; then
            echo "DETECTOR scroll_jitter: FAIL (TUI мёртв: pane_dead=$dead — инфра-условие, НЕ продукт-RED)"
            exit 2
          fi
          T0=$(cat $work/saw-t0.marker)
          T1=$(cat $work/saw-t1.marker)
          TS=$(cat $work/saw-ts.marker)
          # (b) aliveness: трейс жив ДО окна — стрим-фаза обязана дать кадры
          python3 $work/trace-metrics.py --trace "$work/geo.jsonl*" \
            --from "$TS" --to "$T0" --metric saw --expect report \
            --require-frames 50 --detector-name scroll_jitter_prewindow
          # (a) доставка wheel: per-item 'wheel arrive' в окне [t0..t1]
          # (лог ISO с мс '.123Z' vs маркер-секунда — substr(1,19), Z срезан)
          T0S=${T0%Z}; T1S=${T1%Z}
          mouse=/root/.dsh-tui/mouse-debug.log
          if [ -f "$mouse" ]; then
            awk -v a="$T0S" -v b="$T1S" \
              'substr($0,1,19)>=a && substr($0,1,19)<=b' \
              "$mouse" > $frames/scroll/mouse-wheel-window.txt
          else
            : > $frames/scroll/mouse-wheel-window.txt
          fi
          wheel=$(grep -c 'wheel arrive' $frames/scroll/mouse-wheel-window.txt || true)
          if [ "$wheel" -lt 30 ]; then
            echo "DETECTOR scroll_jitter: FAIL (wheel_arrive=$wheel < 30 — SGR wheel-байты не дошли до парсера (терминал/транспорт), инфра-условие, НЕ продукт-RED)"
            exit 2
          fi
          echo "WHEEL_ARRIVE_OK $wheel"
          # (c) продукт-вердикт INLINE-контракта v9 (патч 73: maxScroll>0,
          # скролл чтения истории — фича гейта 67): sticky-off обязателен
          # (ноль = скролл не сработал, exit 2), запрещена только пила
          # scrollHeight (saw_flips>0 = продукт-RED).
          python3 $work/trace-metrics.py --trace "$work/geo.jsonl*" \
            --from "$T0" --to "$T1" --metric saw --expect clean \
            --require-sticky-off --detector-name scroll_jitter
        timeout: 120
        idempotent: true
        retry: 2

  # --- E7: todo-panel scrollback safety net (OPEN BUG, lock-state RED) -------
  # GoalTodoPanel без maxHeight cap → expanded todo list переполняет viewport
  # → todo-panel rows (branch prefixes ├─/└─, glyphs ●/✓/○, fold markers
  # ▾/▸, phase badges ● active/⏸ paused) утекают в terminal scrollback как
  # stale copies. Patch 09 митигация (MAX_TODOS 12, truncate glyphs, 30s
  # collapsed timer, default collapsed=true) — root cause (no maxHeight)
  # UNFIXED.
  # Lock-state: always RED at 80×24 (copies>0). Regression = count INCREASES.
  # GREEN (copies=0) = maxHeight cap added → bug fixed → update test → new
  # state locked. Infra exit 2 = todo panel не отрендерилась (fake-модель
  # может не эмитить goal/todo data — детектор сработает когда условие есть).
  # Трассировка «симптом → тест → детектор»:
  #   E7 «todo-панель двоит список в скроллбеке»
  #     ......... тест e7_todo_scrollback → DETECTOR
  #     e7_todo_scrollback: copies=N (GREEN N=0; RED N>0;
  #     exit 2 = панель не отрендерилась, инфра)
  - name: e7_todo_scrollback
    steps:
      - run: |
          # 80×24 — стандартная геометрия где overflow гарантирован
          # (unit-тест panelOverflow(12,3,24,3)=1 > 0).
          # SCENARIO:todos → todo_write tool_use (15 задач, overflow MAX_TODOS=12 at 80×24).
          tmux resize-window -t $sess -x 80 -y 24; sleep 2
          tmux send-keys -t $sess C-c; sleep 0.5
          tmux send-keys -t $sess C-u; sleep 0.5
          base=$(tmux capture-pane -p -S -2000 -t $sess | grep -c '●' || true)
          echo "$base" > $work/e7-base.txt
          tmux send-keys -t $sess "SCENARIO:todos создай список задач" Enter
          echo E7_SUB_SENT
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          # Ждём рендера todo-панели: "ctrl+q to fold" marker означает что
          # todo_write tool_use выполнен и GoalTodoPanel отрисована.
          # Раньше ждали ● count — но ● появляется из текста ответа ДО
          # выполнения tool_use → race condition: C-q нажимался до рендера панели.
          for w in $(seq 1 60); do
            tmux capture-pane -p -S -2000 -t $sess > $work/e7-sub-wait.txt
            grep -q 'ctrl+q to fold' $work/e7-sub-wait.txt && { echo E7_PANEL_RENDERED; exit 0; }
            sleep 2
          done
          echo E7_PANEL_TIMEOUT
          exit 0
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          # Expand todo panel (ctrl+q = fold toggle) — expanded renders all
          # visible todos (MAX_TODOS=12), maximizing overflow surface.
          # Retry C-q until ▾ (expanded) appears instead of ▸ (collapsed).
          for w in $(seq 1 5); do
            tmux send-keys -t $sess C-q; sleep 1
            state=$(tmux capture-pane -p -S -50 -t $sess | grep -oE '[▾▸]\s*✓' | head -1)
            echo "E7_FOLD_STATE=$state"
            echo "$state" | grep -q '▾' && break
          done
          # Stream content to force scroll (SCENARIO:long = ~45s stream)
          base2=$(tmux capture-pane -p -S -2000 -t $sess | grep -c '●' || true)
          echo "$base2" > $work/e7-base2.txt
          tmux send-keys -t $sess "SCENARIO:long подробный отчёт" Enter
          echo E7_LONG_SENT
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          # Ждём завершения стрима long: ● count grows
          base2=$(cat $work/e7-base2.txt)
          for w in $(seq 1 80); do
            tmux capture-pane -p -S -2000 -t $sess > $work/e7-long-wait.txt
            n=$(grep -c '●' $work/e7-long-wait.txt || true)
            [ "$n" -gt "$base2" ] && { echo E7_LONG_DONE; exit 0; }
            sleep 2
          done
          echo E7_LONG_TIMEOUT
          exit 0
        timeout: 240
        idempotent: true
        retry: 2
      - run: |
          # Ждём стабилизации экрана (статичный кадр = стрим закончился)
          prev=""
          for w in $(seq 1 20); do
            tmux capture-pane -p -t $sess > $work/e7-stable.txt
            cur=$(md5sum < $work/e7-stable.txt | cut -d' ' -f1)
            [ -n "$prev" ] && [ "$cur" = "$prev" ] && { echo E7_STABLE; break; }
            prev="$cur"; sleep 2
          done
          # Захват scrollback + viewport + высоты панели
          tmux display-message -p -t $sess '#{pane_height}' > $work/e7-pane-h.txt
          tmux capture-pane -p -S -2000 -t $sess > $work/e7-scrollback.txt
          tmux capture-pane -p -t $sess > $work/e7-viewport.txt
          echo E7_CAPTURE_DONE
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          cat > $work/det-e7.py <<'PYEOF'
          import re, sys
          # Todo-panel patterns — GoalTodoPanel chrome (footer), NEVER
          # legitimate transcript content. Stale copies in scrollback (lines
          # above live viewport) = E7 bug reproduced.
          # Branch prefix + todo glyph: ├─ ● / └─ ✓ / └─ ○ (expanded state)
          BRANCH_ROW = re.compile(r'[├└]─\s*[●✓○]')
          # Fold header: ▾ ✓ ▍···· · ctrl+q to fold (collapsed/expanded).
          # Real render uses progress-bar ▍ not N/M — matches both states.
          FOLD_HDR = re.compile(r'[▾▸]\s*✓.*ctrl\+q to fold')
          # Phase badge: ● active · N/M or ⏸ paused · N/M or ◜ complete · N/M
          PHASE_BADGE = re.compile(r'[●⏸◰]\s*(active|paused|complete)\s*·\s*\d+/\d+')
          # "+N more" overflow line (removed from GoalTodoPanel in patch 09,
          # but subagent cards may still render it)
          MORE_ROW = re.compile(r'\+\d+\s*more')
          # Collapsed item: indented ● or → ○ without branch prefix (collapsed
          # state shows only in_progress + next pending, no ├─/└─ tree)
          COLLAPSED_ITEM = re.compile(r'^\s{2,}(?:→\s)?[●○✓]\s')
          def is_todo_line(line):
              if BRANCH_ROW.search(line): return True
              if FOLD_HDR.search(line): return True
              if PHASE_BADGE.search(line): return True
              if MORE_ROW.search(line): return True
              if COLLAPSED_ITEM.search(line): return True
              return False
          cap_path = "/root/dsh-inline/e7-scrollback.txt"
          vp_path = "/root/dsh-inline/e7-viewport.txt"
          ph_path = "/root/dsh-inline/e7-pane-h.txt"
          lines = open(cap_path, encoding="utf-8", errors="replace").read().splitlines()
          try:
              pane_h = int(open(ph_path, encoding="utf-8", errors="replace").read().strip())
          except ValueError:
              pane_h = 0
          if pane_h <= 0 or len(lines) == 0:
              print("DETECTOR e7_todo_scrollback: FAIL (pane_height={} cap_lines={} — инфра)".format(pane_h, len(lines)))
              sys.exit(2)
          # Live viewport = last pane_h lines of capture (-S -2000 includes
          # scrollback above + viewport below). Scrollback = everything above.
          viewport_lines = lines[-pane_h:] if pane_h <= len(lines) else lines
          scrollback_lines = lines[:-pane_h] if pane_h < len(lines) else []
          # Count todo-panel patterns in scrollback (stale copies)
          copies = []
          for i, l in enumerate(scrollback_lines):
              if is_todo_line(l):
                  copies.append((i, l.strip()[:100]))
          # Check if panel rendered in viewport (sanity)
          vp_todo = sum(1 for l in viewport_lines if is_todo_line(l))
          if vp_todo == 0 and len(copies) == 0:
              print("DETECTOR e7_todo_scrollback: FAIL (panel_not_rendered — todo patterns отсутствуют в viewport и scrollback, инфра)")
              sys.exit(2)
          print("DETECTOR e7_todo_scrollback: copies={} viewport_todo={} scrollback_lines={} pane_h={} (GREEN copies=0; RED copies>0 — todo-panel rows утекли в scrollback, E7 OPEN bug lock-state)".format(
              len(copies), vp_todo, len(scrollback_lines), pane_h))
          for idx, l in copies[:10]:
              print("  sb[{}] {}".format(idx, l))
          sys.exit(0 if len(copies) == 0 else 1)
          PYEOF
          python3 $work/det-e7.py
        timeout: 120
        idempotent: true
        retry: 2

  # --- Чистый выход + финальный pin-trace ------------------------------------
  - name: exit_clean
    steps:
      - run: |
          tmux send-keys -t $sess C-c; sleep 1; tmux send-keys -t $sess /exit; sleep 1; tmux send-keys -t $sess Enter; sleep 2
          cmd=$(tmux display-message -p -t $sess '#{pane_current_command}')
          echo "DETECTOR exit_clean: pane_cmd=$cmd expected!=node"
          [ "$cmd" != "node" ]
        timeout: 180
        idempotent: true
        retry: 2
      - run: 'if [ -f $pin ]; then cp $pin $mode/pin-trace-final.log; wc -l < $mode/pin-trace-final.log; else echo PIN_TRACE_ABSENT > $mode/pin-trace-final.log; fi; echo STASHED'
        timeout: 240
        retry: 2
        idempotent: true
