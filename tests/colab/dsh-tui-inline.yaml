  # --- E5: цвето-контраст (fg vs bg) по ANSI-кадру меню ----------------------
  # Юзер: «не видно / команд» при рендерящемся меню + «комментарии тем же
  # шрифтом, что фон». Детектор: SGR-парсер, для каждого текст-рана fg/bg;
  # FAIL если есть непустой рун с fg==bg (после сброса — ярко-невидимый текст).
  - name: e5_color_contrast_menu
    steps:
      - run: |
          cat > $work/ansi-contrast.py <<'PYEOF'
          import re, sys
          # SGR-токенизация строки: [(fg, bg, text), ...]; None = дефолт терминала.
          SGR = re.compile(r"\x1b\[([0-9;]*)m")
          def runs(line):
              fg = bg = None; pos = 0; out = []
              for m in SGR.finditer(line):
                  if m.start() > pos:
                      out.append((fg, bg, line[pos:m.start()]))
                  params = [int(p) if p else 0 for p in m.group(1).split(";")] if m.group(1) else [0]
                  i = 0
                  while i < len(params):
                      p = params[i]
                      if p == 0: fg = bg = None
                      elif 30 <= p <= 37: fg = p
                      elif 40 <= p <= 47: bg = p
                      elif p == 39: fg = None
                      elif p == 49: bg = None
                      elif 90 <= p <= 97: fg = p
                      elif 100 <= p <= 107: bg = p
                      elif p == 38 and i + 1 < len(params):
                          if params[i+1] == 5: fg = params[i+2] if i + 2 < len(params) else fg; i += 2
                          elif params[i+1] == 2: fg = tuple(params[i+2:i+5]); i += 4
                      elif p == 48 and i + 1 < len(params):
                          if params[i+1] == 5: bg = params[i+2] if i + 2 < len(params) else bg; i += 2
                          elif params[i+1] == 2: bg = tuple(params[i+2:i+5]); i += 4
                      i += 1
                  pos = m.end()
              if pos < len(line):
                  out.append((fg, bg, line[pos:]))
              return out
          def check(path):
              data = open(path, encoding="utf-8", errors="replace").read().splitlines()
              bad = []
              for ln, line in enumerate(data, 1):
                  for fg, bg, text in runs(line):
                      if text.strip() and fg is not None and fg == bg:
                          bad.append((ln, fg, text.strip()[:40]))
              return bad
          path = sys.argv[1]
          bad = check(path)
          print("DETECTOR e5_color_contrast: invisible_runs={} (fg==bg, непустой текст) file={}".format(len(bad), path.split("/")[-1]))
          for ln, c, t in bad[:10]:
              print("  line={} fg==bg={} text={!r}".format(ln, c, t))
          sys.exit(0 if not bad else 1)
          PYEOF
          python3 $work/ansi-contrast.py $e2/slash-47x43.ansi
        timeout: 240
        retry: 2
        idempotent: true

