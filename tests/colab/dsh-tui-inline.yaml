# suite_version: 1 (2026-09-21, TG-DSH-REBUILD-20260921 узел 2 — inline-парити):
# юзер dsh работает в INLINE-режиме (settings.yaml fullscreen:false), все
# прежние колаб-прогоны эмпирически шли FULLSCREEN → юзер-путь рендера не
# проверялся вообще. Этот сьют — RED-репродукция юзер-багов в юзер-среде:
#   E1 «двоение строк статуса/рамок ввода в скроллбеке до выделения панели» —
#     мусор вне живого кадра в capture -S -2000 (inline-скроллбек).
#   E2 «не видно / команд» — слэш-меню на геометрии юзера 47×43 и на 180×50.
#   свип статуса на геометриях юзера 47×43/80×24/120x40/180×50.
#
# Корень расхождения режимов (migrationPrefs.js + plugin.js:754): миграция
# «fullscreen-factory-default» (flip 0.9.x). На машине БЕЗ маркера
# ~/.dsh-tui/migrations.json юзерский fullscreen:false = «stale pre-flip»:
# первый boot его СТЁР (unset) → fullscreen. У юзера маркер стоит (Zorin,
# 2026-08-29, план 'done') → false уважается → inline. Сьют добивается
# парити: маркер + юзер-dsh-tui-секция (fullscreen:false) → boot inline,
# режим подтверждается пробами (гейт-тест mode_inline).
#
# Парити-конфиг: dsh-tui-секция ЮЗЕРА встроена ниже ДОСЛОВНО (источник:
# ~/.dsh/settings.yaml 2026-09-21; расхождение с ранними описаниями:
# contextBar/shortcutHint/activity = false по факту файла). Провайдеры
# деплоя НЕ трогаем: fake-роут остаётся (FAKE_LLM_KEY=fake-local-key,
# SCENARIO:-маркеры, STREAM_TOTAL_MS=45000 от деплоя).
