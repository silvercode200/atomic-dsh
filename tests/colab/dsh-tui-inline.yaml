# suite_version: 9 (2026-09-29, TG-DSH-MKS4-20260928 узел 5): рекалибровка
# контракта scroll_jitter под патч 73. Патч 73 (CH.04 inline-frame-fullheight:
# inline-кадр всегда высоты терминала, flexShrink:0) сломал предпосылку v7
# «inline вьюпорт = контенту → maxScroll=0 всегда → колесо = visual no-op»:
# теперь maxScroll>0, wheel-up легитимно скроллит историю (фича гейта 67),
# sticky_off>0 — требование работающего скролла, не баг. Golden v8 на стеке 77
# (job program_job_20260929T024120670464Z, 29.09 02:41-03:25 UTC): scroll_jitter
# RED — saw_flips=3 (пила scrollHeight 419↔418) при sticky_off=75. Пила —
# РЕАЛЬНАЯ продуктовая регрессия (маунт StickyPromptHeader in-flow сжимает
# viewport в фикс-кадре — фикс патч 75 CH.05 inline-chrome-overlay), но ассерт
# v7 forbid-sticky-off ругается и на саму фичу скролла. Контракт v9:
#   (c) продукт-вердикт: --require-sticky-off (sticky_off=0 = скролл не
#       сработал, инфра exit 2; >0 — норма) + saw_flips>0 = продукт-RED;
#   (a) доставка wheel и (b) aliveness — без изменений (v7/v8).
# Детектор trace-metrics.py обновлён синхронно (файл + обе встроенные копии;
# флаг --forbid-sticky-off сохранён, помечен v7-ЛЕГАСИ). Миграционная пара
# TG-DSH-PATCHMIG наследует принцип заморозки v8: обе стороны big-bang идут
# на одной сьют-версии (теперь v9) — сопоставимость внутри пары сохранена.
# suite_version: 8 (2026-09-28, TG-DSH-PATCHMIG-20260928 узел 1): транспорт-
# харднинг ретраев. Root-cause транспортных фейлов дня (run-1: 5, run-5: 3;
# все «colabctl timed out after Ns» при зелёных продуктах — union 18/19):
# (а) 21 тест-шаг имел retry:2 БЕЗ idempotent:true — мёртвые ретраи (двухгейт
# SOC, прецедент 5c12d40); CARDS_TURN/COMPACT_EVIDENCE упали в run-1 с
# формально живым retry-полем; (б) heredoc-загрузки детекторов (det-*.py,
# anim-gate.mjs, THINKING_SERIES) ретрая не имели вовсе. Лечение: ВСЕ тест-
# шаги получают retry:2 + idempotent:true; setup-долги boot_launch/
# warmup_short/trace_metrics_lib(2) — тоже. Модель безопасности ретрая:
# colabctl-таймаут = потеря ОТВЕТА, не исполнения (команда дорабатывает на
# VM) — повтор стартует из завершённого состояния; навигация слэш-командами
# самозачищается (C-u/Escape), детекторы пороговые (>=N) или паттерн-детекторы
# — дубликат контента не создаёт garbage; карты/компакт: порог intact>=2 /
# mid_hits>=1, дубликаты лишь добавляют. sess_new: префикс defensive kill —
# трап run-2 «duplicate session» (sess_kill глотает транспорт под
# ignore_error:true). Заморозка для миграционного гейта TG-DSH-PATCHMIG:
# ОБЕ стороны (до/после big-bang) идут на v8 — сопоставимость внутри пары;
# v7-прогоны run-1/run-5 — история (union 18/19, stream_stall не доезжал).
# suite_version: 7 (2026-09-26, TG-DSH-VISUAL-20260925 узел 6): контракт
# scroll_jitter приведён к INLINE-семантике. Root-cause golden68-run2
# (18/19, scroll_jitter — единственный фейл, exit 2 инфра): в inline вьюпорт
# ScrollBox = высоте контента (innerHeight=scrollHeight, maxScroll=0
# ВСЕГДА — контент утекает в скроллбек терминала, патч-модель inline),
# значит гейт 67 (maxScroll<=0 → visual no-op) обязан глотать ВСЕ wheel-
# инъекции: ноль кадров, ноль sticky_off, ноль пилы в окне. Прежний ассерт
# --require-sticky-off («скролл обязан сломать sticky») — FULLSCREEN-
# семантика (там вьюпорт ограничен панелью, maxScroll>0; golden68-run1
# fullscreen-реплика: sticky_off=67), в inline невыполним структурно →
# вечный инфра-фейл. Контракты v7 (валидированы локально тройным прогоном
# reports/scrolljitter-contract-v7-20260926/VALIDATION.md):
#   (a) доставка wheel: boot_launch поднимает DSH_TUI_DEBUG_MOUSE=1;
#       шаг 4 гейтит >=30 строк 'wheel arrive' в окне [t0..t1] из
#       /root/.dsh-tui/mouse-debug.log (logMouseDebug processKeysInBatch,
#       per-item; SGR 64/65 парсится в key 'wheelup'/'wheeldown' — один
#       инжект = одна строка; пусто = терминал/транспорт не доставил —
#       инфра-фейл exit 2, НЕ ложный GREEN);
#   (b) aliveness трейса: >=50 кадров в окне [t_stream..t0] (стрим-фаза
#       пишет ~60 fps; 0 = трейс мёртв → инфра exit 2) — гейт теперь
#       работает и в report-режиме trace-metrics.py;
#   (c) продукт-вердикт: --expect clean --forbid-sticky-off — sticky_off>0
#       = гейт 67 пропустил колесо (пила вернулась) = RED exit 1;
#       saw_flips>0 = RED как раньше. RED-якорь до 67 — юзер-трейс 24.09
#       20:56 UTC: sticky_off=46, saw_flips=10 (пары 42->39x10) — exit 1.
# Требование узла 6 → трассировка дословными терминами:
#   «scroll_jitter» + inline-контракт ........... тест scroll_jitter шаг 4
#       (гейты a/b/c: mouse-wheel-window.txt, scroll_jitter_prewindow,
#       --forbid-sticky-off)
#   «golden-прогон v6» (=> v7 контракта) ........ этот блок + детектор
