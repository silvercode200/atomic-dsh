# SOC-gate REAL functional tests v3 — anti-test-theater
# Evidence = session.jsonl.zstd inspection via Python zstandard module
# Uses FAKE_LLM_KEY=fake-local-key (fake server running on colab with tools/subagent scenarios)
program: soc-gate-functional
lane: colab
vars:
  preset_dir: /root/.dsh/.agent-presets/soc-gate
  probe_file: /tmp/soc-gate-probe.txt

setup:
  - id: deploy_preset
    run: |
      mkdir -p $preset_dir
      echo '' | base64 -d > $preset_dir/soc-gate-enforcer.mjs
      echo '' | base64 -d > $preset_dir/soc-gate-chain.mjs
      echo '' | base64 -d > $preset_dir/soc-gate-prose.mjs
      echo '' | base64 -d > $preset_dir/agent.cordis.yml
      echo '' | base64 -d > $preset_dir/preset.yml
      echo '' | base64 -d > $preset_dir/skill-search.mjs
      ls -la $preset_dir/
      node --check $preset_dir/soc-gate-enforcer.mjs && echo "enforcer syntax OK"
      node --check $preset_dir/soc-gate-chain.mjs && echo "chain syntax OK"
      node --check $preset_dir/soc-gate-prose.mjs && echo "prose syntax OK"
    timeout: 120

  - id: deploy_reader
    run: |
      echo '' | base64 -d > /tmp/read_session.py
      chmod +x /tmp/read_session.py
      python3 -c "import zstandard; print('zstandard', zstandard.__version__)"
      python3 /tmp/read_session.py 2>&1 | head -3
      echo "READER_DEPLOYED"
    timeout: 60

  - id: create_probe
    run: |
      echo "SOC-GATE-PROBE-12345" > $probe_file
      cat $probe_file
    timeout: 30

  - id: check_env
    run: |
      echo "=== dsh version ==="
      dsh --version 2>&1 || echo "DSH_NOT_FOUND"
      echo "=== fake server ==="
      curl -s http://127.0.0.1:8787/health 2>/dev/null || echo "FAKE_DOWN"
      echo "=== zstandard ==="
      python3 -c "import zstandard; print('zstandard', zstandard.__version__)" 2>&1 || echo "NO_ZSTANDARD"
      echo "=== settings ==="
      head -5 /root/.dsh/settings.yaml 2>/dev/null || echo "NO_SETTINGS"
      echo "=== profiles ==="
      ls /root/.dsh/profiles/ 2>/dev/null || echo "NO_PROFILES"
      echo "=== live target ==="
      cat /root/.dsh-live-target 2>/dev/null || echo "NO_TARGET"
    timeout: 60

tests:
  # ============================================================
  # Phase 1: T1+T3+T5 — main blocked, delegates, preset mounted
  # ============================================================
  - name: t1_t3_t5_main_blocked
    steps:
      - run: |
          touch /tmp/marker_p1
          DSH_PROFILE=$(cat /root/.dsh-live-target 2>/dev/null || echo dsh-tui)
          echo "DSH_PROFILE=$DSH_PROFILE"
          FAKE_LLM_KEY=fake-local-key DSH_TUI_PRESET=soc-gate timeout 180 dsh --profile headless "SCENARIO:subagents Read $probe_file and tell me its contents" > /tmp/dsh_p1_out.txt 2>&1
          DSH_RC=$?
          echo "DSH_RC=$DSH_RC"
          head -20 /tmp/dsh_p1_out.txt
          echo "=== DSH OUTPUT END ==="
          SESS=$(find ~/.dsh/sessions -name 'session.jsonl.zstd' -newer /tmp/marker_p1 2>/dev/null | sort | tail -1)
          echo "PARENT_SESSION=$SESS"
          echo "$SESS" > /tmp/parent_p1_path.txt
          if [ -z "$SESS" ]; then
            echo "T1: FAIL - no session.jsonl.zstd found"
            echo "T3: FAIL - no session"
            echo "T5: FAIL - no session"
            cat /tmp/dsh_p1_out.txt | tail -20
            exit 1
          fi
          echo "=== SESSION INSPECTION ==="
          python3 /tmp/read_session.py "$SESS"
          echo "=== T1: direct tool calls ==="
          python3 /tmp/read_session.py "$SESS" "tool-fs" | head -5 || echo "NO_TOOL_FS"
          python3 /tmp/read_session.py "$SESS" "tool-bash" | head -3 || true
          python3 /tmp/read_session.py "$SESS" "run_code" | head -3 || true
          python3 /tmp/read_session.py "$SESS" "tool-presentation" | head -3 || true
          echo "=== T1: subagent ==="
          python3 /tmp/read_session.py "$SESS" "subagent" | head -10 || echo "NO_SUBAGENT"
          echo "=== T3: BLOCKED ==="
          python3 /tmp/read_session.py "$SESS" "BLOCKED by SOC-gate" | head -10 || echo "NO_BLOCKED"
          echo "=== T3: isError ==="
          python3 /tmp/read_session.py "$SESS" "isError" | head -5 || true
          python3 /tmp/read_session.py "$SESS" "SOC_GATE_BLOCKED" | head -5 || true
          echo "=== T5: soc-gate preset ==="
          python3 /tmp/read_session.py "$SESS" "soc-gate" | head -10 || echo "NO_SOC_GATE"
          python3 /tmp/read_session.py "$SESS" "agentPreset" | head -5 || true
        timeout: 210

  # ============================================================
  # T2: child has full toolset
  # ============================================================
  - name: t2_child_toolset
    steps:
      - run: |
          echo "=== T2: find child session ==="
          PARENT=$(cat /tmp/parent_p1_path.txt 2>/dev/null)
          echo "PARENT=$PARENT"
          ALL=$(find ~/.dsh/sessions -name 'session.jsonl.zstd' -newer /tmp/marker_p1 2>/dev/null | sort)
          echo "ALL_SESSIONS:"
          echo "$ALL"
          CHILD=""
          for s in $ALL; do
            if [ "$s" = "$PARENT" ]; then continue; fi
            python3 /tmp/read_session.py "$s" "delegationDepth" 2>/dev/null | grep -q 'MATCHED=[1-9]' && CHILD="$s" && break
          done
          if [ -z "$CHILD" ]; then
            for s in $ALL; do
              if [ "$s" = "$PARENT" ]; then continue; fi
              python3 /tmp/read_session.py "$s" "tool-fs" 2>/dev/null | grep -q 'MATCHED=[1-9]' && CHILD="$s" && break
            done
          fi
          echo "CHILD_SESSION=$CHILD"
          if [ -z "$CHILD" ]; then
            echo "T2: FAIL - no child session found"
            echo "=== dumping all sessions ==="
            for s in $ALL; do
              echo "--- $s ---"
              python3 /tmp/read_session.py "$s" 2>/dev/null | head -5 || echo "cannot read"
            done
            exit 1
          fi
          echo "$CHILD" > /tmp/child_p1_path.txt
          echo "=== T2: child session inspection ==="
          python3 /tmp/read_session.py "$CHILD"
          echo "=== T2: child tool-fs ==="
          python3 /tmp/read_session.py "$CHILD" "tool-fs" | head -10
          echo "=== T2: probe content ==="
          python3 /tmp/read_session.py "$CHILD" "SOC-GATE-PROBE-12345" | head -5
          echo "=== T2: BLOCKED check ==="
          python3 /tmp/read_session.py "$CHILD" "BLOCKED by SOC-gate" | head -5 || echo "NO_BLOCKED_IN_CHILD"
          echo "=== T2: delegationDepth ==="
          python3 /tmp/read_session.py "$CHILD" "delegationDepth" | head -5
        timeout: 120

  # ============================================================
  # T4: depth gate (meta from T1+T2+T3)
  # ============================================================
  - name: t4_depth_gate
    steps:
      - run: |
          echo "=== T4: depth gate ==="
          PARENT=$(cat /tmp/parent_p1_path.txt 2>/dev/null)
          CHILD=$(cat /tmp/child_p1_path.txt 2>/dev/null)
          echo "PARENT=$PARENT"
          echo "CHILD=$CHILD"
          if [ -n "$PARENT" ] && [ -n "$CHILD" ]; then
            echo "=== Parent BLOCKED ==="
            python3 /tmp/read_session.py "$PARENT" "BLOCKED by SOC-gate"
            echo "=== Parent subagent ==="
            python3 /tmp/read_session.py "$PARENT" "subagent"
            echo "=== Child tool-fs ==="
            python3 /tmp/read_session.py "$CHILD" "tool-fs"
            echo "=== Child BLOCKED ==="
            python3 /tmp/read_session.py "$CHILD" "BLOCKED by SOC-gate"
            PB=$(python3 /tmp/read_session.py "$PARENT" "BLOCKED by SOC-gate" 2>/dev/null | grep 'BLOCKED_COUNT=' | cut -d= -f2)
            CF=$(python3 /tmp/read_session.py "$CHILD" "tool-fs" 2>/dev/null | grep 'MATCHED=' | cut -d= -f2)
            echo "Parent_BLOCKED=${PB:-0}"
            echo "Child_tool_fs=${CF:-0}"
            if [ "${PB:-0}" -gt 0 ] && [ "${CF:-0}" -gt 0 ]; then
              echo "T4: PASS - main blocked, child has tool-fs"
            else
              echo "T4: FAIL - PB=${PB:-0} CF=${CF:-0}"
            fi
          else
            echo "T4: FAIL - parent/child paths missing"
          fi
        timeout: 90

  # ============================================================
  # T6: non-SOC regression
  # ============================================================
  - name: t6_non_soc_regression
    steps:
      - run: |
          touch /tmp/marker_t6
          FAKE_LLM_KEY=fake-local-key timeout 180 dsh --profile headless "Read $probe_file" > /tmp/dsh_t6_out.txt 2>&1
          DSH_RC=$?
          echo "T6_DSH_RC=$DSH_RC"
          head -10 /tmp/dsh_t6_out.txt
          SESS=$(find ~/.dsh/sessions -name 'session.jsonl.zstd' -newer /tmp/marker_t6 2>/dev/null | sort | tail -1)
          echo "T6_SESSION=$SESS"
          if [ -z "$SESS" ]; then
            echo "T6: FAIL - no session"
            cat /tmp/dsh_t6_out.txt | tail -20
            exit 1
          fi
          echo "=== T6 session inspection ==="
          python3 /tmp/read_session.py "$SESS"
          echo "=== T6: tool-fs ==="
          python3 /tmp/read_session.py "$SESS" "tool-fs" | head -10
          echo "=== T6: probe content ==="
          python3 /tmp/read_session.py "$SESS" "SOC-GATE-PROBE-12345" | head -5
          echo "=== T6: BLOCKED check ==="
          python3 /tmp/read_session.py "$SESS" "BLOCKED by SOC-gate" | head -5 || echo "NO_BLOCKED"
          echo "=== T6: soc-gate check ==="
          python3 /tmp/read_session.py "$SESS" "soc-gate" | head -5 || echo "NO_SOC_GATE"
        timeout: 210

  # ============================================================
  # Phase 2: T7+T8+T9 — verdict chain
  # ============================================================
  - name: t7_t8_t9_verdict
    steps:
      - run: |
          touch /tmp/marker_p2
          DSH_PROFILE=$(cat /root/.dsh-live-target 2>/dev/null || echo dsh-tui)
          echo "DSH_PROFILE=$DSH_PROFILE"
          FAKE_LLM_KEY=fake-local-key DSH_TUI_PRESET=soc-gate timeout 180 dsh --profile headless "SCENARIO:subagents Read $probe_file via a subagent, then render your verdict" > /tmp/dsh_p2_out.txt 2>&1
          DSH_RC=$?
          echo "P2_DSH_RC=$DSH_RC"
          head -20 /tmp/dsh_p2_out.txt
          echo "=== DSH OUTPUT END ==="
          SESS=$(find ~/.dsh/sessions -name 'session.jsonl.zstd' -newer /tmp/marker_p2 2>/dev/null | sort | tail -1)
          echo "P2_SESSION=$SESS"
          if [ -z "$SESS" ]; then
            echo "T7: FAIL - no session"
            echo "T8: FAIL - no session"
            echo "T9: FAIL - no session"
            cat /tmp/dsh_p2_out.txt | tail -20
            exit 1
          fi
          echo "=== P2 session inspection ==="
          python3 /tmp/read_session.py "$SESS"
          echo "=== T7: subagent ==="
          python3 /tmp/read_session.py "$SESS" "subagent" | head -10
          echo "=== T7: verdict message ==="
          python3 /tmp/read_session.py "$SESS" "SOC-gate verdict for subagent" | head -5
          echo "=== T7: soc-gate-verdict ==="
          python3 /tmp/read_session.py "$SESS" "soc-gate-verdict" | head -5
          echo "=== T8: Status completed ==="
          python3 /tmp/read_session.py "$SESS" "Status: completed" | head -5
          echo "=== T9: render_verdict ==="
          python3 /tmp/read_session.py "$SESS" "render_verdict" | head -10
          echo "=== T9: schema ==="
          python3 /tmp/read_session.py "$SESS" "soc-gate-verdict/1" | head -5
          echo "=== T9: verdict field ==="
          python3 /tmp/read_session.py "$SESS" "verdict" | head -10
          echo "=== T9: exit_code ==="
          python3 /tmp/read_session.py "$SESS" "exit_code" | head -5
        timeout: 210
