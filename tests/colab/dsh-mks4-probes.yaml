      - run: |
          cat > $work/det-narrow.py <<'PYEOF'
          import glob, json, os, re, sys
          from collections import Counter
          CHROME = [
              ("frame_top",    lambda l: "╭" in l and "────" in l),
              ("frame_bottom", lambda l: "╰" in l and "────" in l),
              ("prompt",       lambda l: "❯" in l and "⛶" in l),
              ("status_row",   lambda l: "✦" in l and "dsh-TUI" not in l),
              ("pct_glyph",    lambda l: "⚡" in l),
              ("gauge",        lambda l: "▕" in l and "█" in l),
              ("comp_left",    lambda l: bool(re.search(r"comp\s+\d", l))),
              ("cache_pct",    lambda l: bool(re.search(r"cache\s+\d", l))),
          ]
          def is_rewrap_frag(lines, i):
              # tmux при ресайзе переупаковывает скроллбек по новой ширине:
              # разорванный логотип «...✦ dsh» + «-TUI v...» — терминальная
              # норма, не E1-дубль (исключение из garbage.py golden)
              l = lines[i]
              if "✦" not in l or "dsh-TUI" in l:
                  return False
              for j in range(i + 1, min(i + 3, len(lines))):
                  if lines[j].strip():
                      return "dsh-TUI" in (l + lines[j])
              return False
          def garbage(path):
              lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
              last_frame = None
              for i, l in enumerate(lines):
                  if "╭" in l and "────" in l:
                      last_frame = i
              broken = last_frame is None or (len(lines) - last_frame) > 12
              top = last_frame if (last_frame is not None and not broken) else 0
              g, per = 0, Counter()
              for i, l in enumerate(lines[:top]):
                  if is_rewrap_frag(lines, i):
                      continue
                  hits = [n for n, fn in CHROME if fn(l)]
                  if hits:
                      g += 1
                      per.update(hits)
              return g, dict(per)
          records = []
          trace_files = 0
          for path in sorted(glob.glob("/root/dsh-mks4/geo.jsonl*")):
              trace_files += 1
              try:
                  fh = open(path, encoding="utf-8", errors="replace")
              except OSError:
                  continue
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      rec = json.loads(line)
                  except ValueError:
                      continue
                  records.append(rec)
          if trace_files == 0 or not records:
              print("DETECTOR narrow_resize_viewport: FAIL (trace_files={} records={} — трейс не пишется, инфра)".format(trace_files, len(records)))
              sys.exit(2)
          # граница = первый кадр columns<51 ПОСЛЕ хотя бы одного кадра
          # columns==51 (бут 25×23 исключается: до широкого 51 взрыв не
          # считается — юзер-факт «на 51 колонках клемп работает»)
          boundary = None
          seen_51 = False
          for i, rec in enumerate(records):
              lst = rec.get("list") or {}
              cols = lst.get("columns")
              if cols == 51:
                  seen_51 = True
              if boundary is None and seen_51 and cols is not None and cols < 51:
                  boundary = i
          if boundary is None:
              print("DETECTOR narrow_resize_viewport: FAIL (narrow_boundary_not_found — узкий resize не дошёл до трейса, инфра)")
              sys.exit(2)
          violations = 0
          v_view = 0
          v_inner = 0
          worst = 0
          first_t = None
          term_rows = None
          for i, rec in enumerate(records):
              lst = rec.get("list") or {}
              if lst.get("termRows"):
                  term_rows = lst["termRows"]
              if i < boundary or term_rows is None:
                  continue
              vp = lst.get("viewport")
              if vp is not None and vp > term_rows:
                  violations += 1
                  v_view += 1
                  worst = max(worst, vp - term_rows)
                  if first_t is None:
                      first_t = rec.get("t")
              for s in rec.get("scroll") or []:
                  if not isinstance(s, dict):
                      continue
                  ih = s.get("innerHeight")
                  if ih is not None and ih > term_rows:
                      violations += 1
                      v_inner += 1
                      worst = max(worst, ih - term_rows)
                      if first_t is None:
                          first_t = rec.get("t")
          if term_rows is None:
              print("DETECTOR narrow_resize_viewport: FAIL (termRows неизвестен ни в одном кадре, инфра)")
              sys.exit(2)
          NARROW = "/root/dsh-mks4-frames/narrow"
          gmax = 0
          gworst_pat = {}
          for name in ("resize-25x23.txt", "resize-24x23.txt", "resize-16x23.txt"):
              p = os.path.join(NARROW, name)
              if not os.path.exists(p):
                  continue
              g, pat = garbage(p)
              print("narrow/{} garbage_lines={} patterns={}".format(name, g, pat))
              if g > gmax:
                  gmax = g
                  gworst_pat = pat
          print("DETECTOR narrow_resize_viewport: violations={} worst=+{} scrollback_garbage={} (инвариант list.viewport<=termRows и scroll.innerHeight<=termRows на КАЖДОМ кадре после первого узкого resize; v_viewport={} v_inner={} first_violation_t={} garbage_patterns={}; RED: violations>0 ИЛИ garbage>0)".format(
              violations, worst, gmax, v_view, v_inner, first_t, gworst_pat))
          sys.exit(0 if (violations == 0 and gmax == 0) else 1)
          PYEOF
          python3 $work/det-narrow.py
