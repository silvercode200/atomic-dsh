program: dsh-mks4-probes
# suite_version: 1 (2026-09-28, TG-DSH-MKS4-20260928 узел 2-4 — RED-пробы).
# Самодостаточный probe-сьют под юзер-репорт 2026-09-28 (WezTerm+zellij,
# inline, тема tokyonight-moon, фон #000000): dsh в сплите 51×23 —
# zellij-пейна фактически 25×23 (трейс-факт: boot-кадры columns:25
# termRows:23). 3 визуальных бага; корни по always-on трейсу юзера
# (~/.dsh-tui/trace/geometry-2026-09-28.jsonl, 1253 кадра, pid 452921):
#   БАГ-2 (бут): суммарный кадр ~20-26 строк при пейне 23 → низ рамки
#     ввода (глиф ╰) не у ноги пейна, зазор ~3+ строк.
#   БАГ-3 (главный, корень доказан): после resize 51→узкие (25/24/16)
#     viewport и scroll.innerHeight ScrollBox ВЗРЫВАЮТСЯ до 81-118 строк
#     при termRows=23 (260/277 кадров с viewport>termRows, worst=+118 на
#     16 колонках; maxScroll сбрасывается в 0, sticky=true) — каждый кадр
#     выталкивает 40-95 строк в скроллбек пейна → пустые/чёрные зоны при
#     скролле. Первый взрыв — ровно на первом кадре после узкого resize.
#     Здоровое состояние до resize: viewport=17 при termRows=23; на 51
#     колонках клемп держится.
#   БАГ-4: пункты слэш-меню невидимы, пока не переведёшь выделение (виден
#     только выделенный) — подозрение dim-атрибут (SGR 2) невыделенных
#     пунктов и/или fg≈ЧЁРНОМУ фону юзера #000000; e5_color_contrast_menu
#     golden в tmux PASS — значит мерить надо dim и контраст против #000000,
#     не только fg==bg темы.
# Разрыв покрытия golden (tests/colab/dsh-tui-inline.yaml, suite_version 7):
# все геометрии >=47 колонок и >=24 строк (свип 47×43/80×24/120×40/180×50;
# fuzz-пул w 40-240 h 24-60; e1_garbage_resize 120→80→47) — геометрия юзера
# 51×23 и узкие ресайзы 25/24/16 НЕ покрыты вообще. Этот сьют закрывает
# разрыв; golden и tests/colab/trace-metrics.py НЕ тронуты (заморожены под
# миграционный гейт SUBSYS.FF.B — ренумерация/ревью одной волной).
#
# ТРАССИРУЕМОСТЬ «симптом юзера → тест → детектор»:
#   баг-2 «рамка ввода не у ноги пейна, зазор 3+» (бут, 25×23)
#     ......... тест boot_input_anchor → DETECTOR boot_input_anchor: gap=N
#                (GREEN gap<=2; RED = зазор 3+; якорь = последняя строка с
#                глифом ╰ — приём det-fuzz.py golden; БЕЗ warmup-хода)
#   баг-3 «взрыв viewport при узком resize + пустые зоны в скроллбеке»
#     ......... тест narrow_resize_viewport → DETECTOR
#                narrow_resize_viewport: violations=N worst=+X
#                scrollback_garbage=M (RED: violations>0 — кадры с
#                list.viewport>termRows или scroll.innerHeight>termRows
#                после первого узкого resize; ИЛИ garbage>0 — мусор хрома
#                в capture -S -2000 вне живого кадра, порог 0 как в
#                e1_garbage_* golden)
#   баг-4 «пункты слэш-меню невидимы до перевода выделения» (51×23)
#     ......... тест slash_menu_contrast → DETECTOR
#                slash_menu_contrast: dim=N lowcontrast=M (RED: dim>0 —
#                SGR 2 на тексте невыделенных пунктов; ИЛИ lowcontrast>0 —
#                контраст fg против #000000 < 1.5:1, WCAG-luminance)
#
# ОЖИДАЕМЫЕ RED (узел 2-4 = RED-пробы): все три детектора на текущем стеке
# (патч 72) обязаны упасть exit 1 = юзер-баги воспроизведены; фейл теста =
# reproduced, НЕ поломка сьюта. Инфра-фейлы (exit 2: трейс не пишется,
# слэш-меню не открылось, кадр/граница/контент отсутствуют) разбираются по
# тексту DETECTOR-строки (конвенция golden: 0/1/2 = PASS/RED/инфра).
#
# Запуск (драйвер):
#   bash scripts/colab-dsh-live-check.sh \
#     --target current --fake-model --label mks4-red \
#     --suite tests/colab/dsh-mks4-probes.yaml \
#     --detectors boot_input_anchor,narrow_resize_viewport,slash_menu_contrast
#
# Механика (зеркалит golden dsh-tui-inline.yaml): lane colab; сравнения на
# госте в run-шагах (НЕ в assert — ColabResult.output несёт IPython-шум);
# шаги <15К символов (чанк-канал colab exec); heredoc-тела НЕ содержат
# $переменных программы (executor раскрывает их в тексте шага ДО отправки
# на VM — в python-детекторах абсолютные VM-пути хардкодом); внутренние
# переменные шагов ($b/$n/$w/$T/$i) названы иначе переменных программы;
# трейс сессии = DSH_TUI_GEOMETRY_TRACE (boot_launch, прецедент —
# scripts/colab-dsh-geometry-trace.sh; ротация 8МБ → geo.jsonl.1 — детектор
# глобит 'geo.jsonl*'; отдельный путь: деплойный boot-smoke пишет свой);
# boot с самовосстановлением (flaky-boot agent-bootstrap hang: kill +
# relaunch до 3 попыток — память dsh-flaky-boot-agent-bootstrap-hang).
# Хронология юзера: бут 25×23 → 51×23 → контент → узкие 25/24/16×23 — сьют
# повторяет её. НИКАКОГО warmup в setup: тест 1 меряет бут-кадр ДО первого
# хода (первый turn глотает SCENARIO-маркер — warmup перенесён в тест 2).
# Сидов/рандома нет — вся серия детерминирована.
lane: colab
vars:
  sess: dsh-mks4
  frames: /root/dsh-mks4-frames
  boot: /root/dsh-mks4-frames/boot
  narrow: /root/dsh-mks4-frames/narrow
  slash: /root/dsh-mks4-frames/slash
  mode: /root/dsh-mks4-frames/mode
  work: /root/dsh-mks4
  geo: /root/dsh-mks4/geo.jsonl

setup:
  - id: dirs_init
    run: 'mkdir -p $work $frames && rm -rf $boot $narrow $slash $mode && mkdir -p $boot $narrow $slash $mode $work && rm -f $frames/*.txt $work/*.txt $work/*.py $work/*.marker $work/geo.jsonl $work/geo.jsonl.1; echo DIRS_OK'
    timeout: 180
    idempotent: true
    retry: 2
  - id: sess_kill
    run: 'tmux kill-session -t $sess 2>/dev/null; true'
    timeout: 180
    ignore_error: true
    idempotent: true
    retry: 2
  # Пустая панель-оболочка (без команды) — send-keys уходит в shell панели.
  # Геометрия СТАРТА юзера: 25×23 (трейс-факт: boot-кадры columns:25
  # termRows:23 — zellij-пейна внутри сплита 51×23). Тест 2 поднимет до
  # 51×23 перед контентом, тест 3 вернёт 51×23 для слэш-меню.
  - id: sess_new
    run: 'tmux new-session -d -s $sess -x 25 -y 23'
    timeout: 180
    idempotent: true
    retry: 2
  - id: term_overrides
    run: 'tmux set -as terminal-overrides ",xterm-256color:Tc"'
    timeout: 180
    idempotent: true
    retry: 2
  # --- Парити-слой: юзер-dsh-tui-секция → /root/.dsh/settings.yaml ---------
  # Дословно из golden (источник ~/.dsh/settings.yaml юзера): fullscreen:
  # false = inline-режим, тема tokyonight-moon, фон юзера #000000 живёт в
  # WezTerm (терминал), а не в settings — детектор теста 3 мерит против
  # #000000 константой. Срезаем существующую dsh-tui секцию (до следующего
  # top-level ключа), дописываем юзерскую. Провайдеры/fake-роут не трогаем.
  - id: parity_settings
    run: |
      cp /root/.dsh/settings.yaml /root/.dsh/settings.yaml.parity-backup-mks4 2>/dev/null || true
      awk '/^dsh-tui:/{s=1} s==1 && /^[^[:space:]#]/ && !/^dsh-tui:/{s=0} s==0{print}' /root/.dsh/settings.yaml > /root/.dsh/settings.yaml.new
      cat >> /root/.dsh/settings.yaml.new <<'TUIEOF'
      dsh-tui:
        statusBar:
          tokens: false
          compact: false
          contextBar: false
          mode: true
          trajectory: true
          shortcutHint: false
          activity: false
          cache: false
          gitBranch: false
          compactThresholdRatio: 0.4768
          tps: false
          sessionTitle: false
          sessionId: false
          cwd: true
          ctxBarMode: percent-only
        fullscreen: false
        minimal: false
        toolBackground: subtle
        appearance:
          powerline: full
          theme: tokyonight-moon
          inputBorder: "#7aa2f7"
          animations: false
      TUIEOF
      mv /root/.dsh/settings.yaml.new /root/.dsh/settings.yaml
      cp /root/.dsh/settings.yaml $mode/settings-parity.txt
      grep -n 'fullscreen' /root/.dsh/settings.yaml > $mode/settings-fullscreen-parity.txt 2>/dev/null || echo 'NO_FULLSCREEN_KEY' > $mode/settings-fullscreen-parity.txt
      grep -n 'animations' /root/.dsh/settings.yaml > $mode/settings-animations-parity.txt 2>/dev/null || echo 'NO_ANIMATIONS_KEY' > $mode/settings-animations-parity.txt
      echo PARITY_APPLIED
    timeout: 180
    idempotent: true
    retry: 2
  # --- Парити-маркер миграции: fullscreen-factory-default = done ------------
  # Без маркера первый boot сносит юзерский fullscreen:false ('unset' план).
  - id: parity_marker
    run: |
      if [ ! -f /root/.dsh-tui/migrations.json ]; then
        printf '{\n  "fullscreen-factory-default": "2026-08-29T00:00:00.000Z"\n}\n' > /root/.dsh-tui/migrations.json
      fi
      cp /root/.dsh-tui/migrations.json $mode/migrations-at-parity.json 2>/dev/null || echo MARKER_ABSENT > $mode/migrations-at-parity.json
      test -f /root/.dsh-tui/migrations.json && echo MARKER_PRESENT
    timeout: 180
    idempotent: true
    retry: 2
  # --- Запуск TUI (fake-роут + geometry-trace) + самовосст. boot -----------
  # DSH_TUI_GEOMETRY_TRACE=$geo — детерминированный трейс-путь сессии сьюта
  # (патч 61 always-on; оверрайд-прецедент scripts/colab-dsh-geometry-trace.sh;
  # деплойный boot-smoke держит СВОЙ dsh на дефолтном трейсе — общий файл
  # дал бы два писателя). Ротация 8МБ → geo.jsonl.1: детектор глобит
  # 'geo.jsonl*'; каждый launch начинает с чистого файла. Flaky-boot
  # (вис agent-bootstrap): kill + relaunch до 3 попыток, 60с/попытка.
  # WARMUP ЗДЕСЬ НЕТ — тест 1 меряет чистый бут-кадр (см. шапку).
  - id: boot_launch
    run: |
      dsh_launch() {
        rm -f $geo $geo.1
        rm -f /root/dsh-boot-mks4.err
        tmux send-keys -t $sess "FAKE_LLM_KEY=fake-local-key DSH_TUI_GEOMETRY_TRACE=$geo dsh --profile $(cat /root/.dsh-live-target) 2>/root/dsh-boot-mks4.err" Enter
      }
      boot_poll() {
        for i in $(seq 1 $1); do
          tmux capture-pane -p -t $sess > $mode/boot.txt
          if grep -qE '❯|for shortcuts' $mode/boot.txt; then return 0; fi
          sleep 1
        done
        return 1
      }
      dsh_launch
      for attempt in 1 2 3; do
        if boot_poll 60; then echo "BOOT_READY (attempt $attempt)"; exit 0; fi
        echo "BOOT_RETRY attempt=$attempt: hung TUI, kill + relaunch"
        tmux send-keys -t $sess C-c 2>/dev/null || true
        sleep 1
        pkill -f '/usr/local/bin/dsh --profile' 2>/dev/null || true
        sleep 2
        tmux send-keys -t $sess reset Enter 2>/dev/null || true
        sleep 1
        dsh_launch
      done
      echo NOT_READY
      exit 1
    timeout: 320
  # --- Файн-гейт бута: экран реально затих ---------------------------------
  # BOOT_READY матчит 'for shortcuts' уже на первом кадре бут-анимации, а
  # bootstrap-запросы фейк-модели (контекст/титул, ~45с каждый) анимируют
  # экран ещё минуты — ввод в этом окне не активен, посланный промпт
  # теряется (run-1: 68 anim-кадров 4.2 мин ПОСЛЕ BOOT_READY). Тихий экран
  # = трейс-файл молчит >=12с (кадров нет = анимация кончилась) И ❯ в кадре.
  # Мягкий фоллбек через ~300с (❯ есть, но не затих) — warmup теста 2
  # добьёт ре-сендом; жёсткий (нет ❯) = инфра-фейл бута.
  - id: boot_quiet
    run: |
      for i in $(seq 1 60); do
        if [ -f $geo ] && [ $(( $(date +%s) - $(stat -c %Y $geo) )) -ge 12 ]; then
          if tmux capture-pane -p -t $sess | grep -q '❯'; then
            echo QUIET_READY
            exit 0
          fi
        fi
        sleep 5
      done
      if tmux capture-pane -p -t $sess | grep -q '❯'; then
        echo QUIET_TIMEOUT_SOFT
        exit 0
      fi
      echo QUIET_NO_PROMPT
      exit 1
    timeout: 400
    idempotent: true
    retry: 2

tests:
  # --- БАГ-2: якорь рамки ввода на буте (25×23, БЕЗ warmup-хода) -----------
  # Юзер-репорт: на буте суммарный кадр ~20-26 строк при пейне 23 → низ
  # рамки ввода (╰) не у ноги пейна, зазор 3+. Якорь = ПОСЛЕДНЯЯ строка с
  # глифом ╰ в живом кадре (приём det-fuzz.py golden); зазор = pane_h −
  # номер строки якоря (1-based). Интро dsh ~4.8с — после boot_poll (❯ уже
  # виден) даём кадру устаканиться ~6с, ДО любого warmup-хода.
  - name: boot_input_anchor
    steps:
      - run: |
          sleep 6
          tmux capture-pane -p -t $sess > $boot/boot-25x23.txt
          tmux display-message -p -t $sess '#{pane_height}' > $boot/boot-pane-h.txt
          echo BOOT_FRAME_CAPTURED
        timeout: 180
        idempotent: true
        retry: 2
      - run: |
          cat > $work/det-boot.py <<'PYEOF'
          import sys
          if len(sys.argv) < 3:
              print("DETECTOR boot_input_anchor: FAIL (argv — инфра)")
              sys.exit(2)
          cap_path, pane_path = sys.argv[1], sys.argv[2]
          lines = open(cap_path, encoding="utf-8", errors="replace").read().splitlines()
          raw = open(pane_path, encoding="utf-8", errors="replace").read().strip()
          try:
              pane_h = int(raw)
          except ValueError:
              pane_h = 0
          if pane_h <= 0:
              print("DETECTOR boot_input_anchor: FAIL (pane_height неизвестна — инфра)")
              sys.exit(2)
          # якорь = последняя строка с глифом ╰ (низ рамки ввода)
          bottoms = [i for i, l in enumerate(lines) if "╰" in l]
          if not bottoms:
              print("DETECTOR boot_input_anchor: FAIL (frame_bottom_missing — рамка ввода (╰) не отрендерилась, инфра)")
              sys.exit(2)
          anchor = bottoms[-1] + 1
          gap = pane_h - anchor
          print("DETECTOR boot_input_anchor: gap={} pane_h={} anchor_row={} capture_lines={} (GREEN gap<=2 — рамка у ноги пейна; юзер-репорт баг-2: зазор 3+)".format(gap, pane_h, anchor, len(lines)))
          sys.exit(0 if gap <= 2 else 1)
          PYEOF
          python3 $work/det-boot.py $boot/boot-25x23.txt $boot/boot-pane-h.txt
        timeout: 120
        idempotent: true
        retry: 2

  # --- БАГ-3 (главный): узкий resize → взрыв viewport + мусор скроллбека ---
  # Хронология юзера: 51×23 (широкое, здоровый клемп viewport=17) → контент
  # (sH 43+) → узкие 25/24/16×23 — на первом же кадре после узкого resize
  # viewport/innerHeight взрываются до 81-118 при termRows=23 (юзер-трейс:
  # 260/277 кадров, worst=+118 на 16 колонках), maxScroll=0, sticky=true;
  # каждый кадр выталкивает 40-95 строк в скроллбек → пустые/чёрные зоны.
  # Гейты честности: (1) warmup-ход — первый turn глотает SCENARIO-маркер;
  # (2) контент-гейт — max scrollHeight >= 43 на кадрах columns==51 (мало
  # контента = нет материала для взрыва = инфра exit 2, НЕ продукт-GREEN);
  # (3) детектор по трейсу: граница узкого resize = первый кадр columns<51
  # ПОСЛЕ кадра columns==51 (boot-фаза 25×23 исключается), инвариант
  # list.viewport<=termRows И scroll.innerHeight<=termRows на КАЖДОМ кадре
  # после границы; (4) скроллбек-мусор: CHROME-паттерны golden e1_garbage
  # (повторы бордюров/статус-глифов вне живого кадра), порог = 0.
  - name: narrow_resize_viewport
    steps:
      - run: |
          tmux resize-window -t $sess -x 51 -y 23; sleep 2
          echo WIDE51_SET
        timeout: 180
        idempotent: true
        retry: 2
      # warmup-ход: бут на фейк-модели длится до ~4 мин ПОСЛЕ ложного
      # BOOT_READY — промпт, посланный в окно бута, теряется. Ре-сенд
      # каждые ~16с (ввод чистим C-u), гейт = ● (буллет ассистент-сообщения;
      # пустой base-файл run-1 — транспортный wedge, скрипт не исполнялся:
      # idempotent+retry+маркер делают повтор безопасным).
      - run: |
          [ -f $work/warmup-done.marker ] && { echo WARMUP_ALREADY_DONE; exit 0; }
          n0=$(tmux capture-pane -p -t $sess | grep -c '●' || true)
          [ "$n0" -ge 1 ] && { touch $work/warmup-done.marker; echo WARMUP_ALREADY_DONE; exit 0; }
          ok=0
          for attempt in $(seq 1 14); do
            tmux send-keys -t $sess C-u
            tmux send-keys -t $sess "SCENARIO:short привет, ответь кратко" Enter
            for w in $(seq 1 7); do
              sleep 2
              n=$(tmux capture-pane -p -t $sess | grep -c '●' || true)
              [ "$n" -ge 1 ] && { ok=1; break; }
            done
            [ "$ok" = 1 ] && break
          done
          if [ "$ok" = 1 ]; then
            # конец стрима short: экран статичен (иначе base для long
            # поймает ещё растущий ●-счётчик)
            prev=$(tmux capture-pane -p -t $sess)
            for w in $(seq 1 20); do
              sleep 3
              cur=$(tmux capture-pane -p -t $sess)
              [ "$cur" = "$prev" ] && break
              prev=$cur
            done
            touch $work/warmup-done.marker
            echo WARMUP_DONE
            exit 0
          fi
          echo WARMUP_TIMEOUT
          exit 1
        timeout: 340
        idempotent: true
        retry: 2
      - run: |
          [ -f $work/long-done.marker ] && { echo LONG_ALREADY_DONE; exit 0; }
          b=$(tmux capture-pane -p -t $sess | grep -c '●' || true)
          ok=0
          for attempt in $(seq 1 3); do
            tmux send-keys -t $sess C-u
            tmux send-keys -t $sess "SCENARIO:long напиши длинный текст" Enter
            for w in $(seq 1 10); do
              sleep 2
              n=$(tmux capture-pane -p -t $sess | grep -c '●' || true)
              [ "$n" -gt "$b" ] && { ok=1; break; }
            done
            [ "$ok" = 1 ] && break
          done
          [ "$ok" = 1 ] || { echo LONG_TIMEOUT; exit 1; }
          # стрим long до ~45с (STREAM_TOTAL_MS): ждём пока экран перестанет
          # меняться — иначе cg-content прочитает недорисованный транскрипт
          prev=$(tmux capture-pane -p -t $sess)
          for w in $(seq 1 25); do
            sleep 3
            cur=$(tmux capture-pane -p -t $sess)
            [ "$cur" = "$prev" ] && break
            prev=$cur
          done
          touch $work/long-done.marker
          echo LONG_DONE
          exit 0
        timeout: 320
        idempotent: true
        retry: 2
      - run: |
          cat > $work/cg-content.py <<'PYEOF'
          import glob, json, sys
          best = 0
          found = False
          for path in sorted(glob.glob("/root/dsh-mks4/geo.jsonl*")):
              try:
                  fh = open(path, encoding="utf-8", errors="replace")
              except OSError:
                  continue
              for line in fh:
                  line = line.strip()
                  if not line:
                      continue
                  try:
                      rec = json.loads(line)
                  except ValueError:
                      continue
                  lst = rec.get("list") or {}
                  if lst.get("columns") == 51:
                      found = True
                      for s in rec.get("scroll") or []:
                          if isinstance(s, dict) and s.get("scrollHeight"):
                              best = max(best, s["scrollHeight"])
          if not found:
              print("CONTENT_GATE: FAIL (нет кадров columns==51 в трейсе — resize/трейс не дошёл, инфра)")
              sys.exit(2)
          print("CONTENT_GATE: max_scrollHeight_51cols={} required>=43 (контент для взрыва viewport)".format(best))
          sys.exit(0 if best >= 43 else 2)
          PYEOF
