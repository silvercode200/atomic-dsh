  # --- БАГ-4: контраст невыделенных пунктов слэш-меню (51×23) --------------
  # Юзер-репорт: пункты слэш-меню невидимы, пока не переведёшь выделение
  # (виден только выделенный). Локус: фон юзера #000000 (WezTerm override +
  # патч 36) — e5_color_contrast_menu golden (fg==bg ТЕМЫ) в tmux PASS,значит
  # проверяем (а) dim-атрибут SGR 2 на тексте невыделенных пунктов и (б)
  # контраст fg против ЧЁРНОГО #000000 (WCAG-относительная luminance, порог
  # 1.5:1). Меню: '/' в инпут, кадр -pe с ANSI; item-строки = блок после
  # заголовка 'commands · N items' (строки с │ и командным словом, приём
  # e2_slash_menu golden); невыделенные = без ❯. fg резолвится из 38;2
  # truecolor, 38;5 палитры xterm-256 и базовых 30-37/90-97.
  - name: slash_menu_contrast
    steps:
      - run: |
          tmux send-keys -t $sess C-c; sleep 0.3
          tmux send-keys -t $sess C-u; sleep 0.5
          tmux resize-window -t $sess -x 51 -y 23; sleep 1.5
          tmux send-keys -t $sess /; sleep 2
          tmux capture-pane -p -t $sess > $slash/slash-51x23.txt
          tmux capture-pane -pe -t $sess > $slash/slash-51x23.ansi
          tmux send-keys -t $sess C-u; sleep 0.5
          echo SLASH_CAPTURED
        timeout: 240
      - run: |
          cat > $work/det-slash.py <<'PYEOF'
          import re, sys
          if len(sys.argv) < 2:
              print("DETECTOR slash_menu_contrast: FAIL (argv — инфра)")
              sys.exit(2)
          BLACK = (0, 0, 0)
          CONTRAST_MIN = 4.5  # WCAG AA normal text; прежний 1.5 пропускал #5F5F87 (3.47:1) — баг-4 «пункты невидимы»
          ANSI16 = {
              30: (0, 0, 0), 31: (205, 0, 0), 32: (0, 205, 0), 33: (205, 205, 0),
              34: (0, 0, 238), 35: (205, 0, 205), 36: (0, 205, 205), 37: (229, 229, 229),
              90: (127, 127, 127), 91: (255, 0, 0), 92: (0, 255, 0), 93: (255, 255, 0),
              94: (100, 100, 255), 95: (255, 0, 255), 96: (0, 255, 255), 97: (255, 255, 255),
          }
          def _pal256():
              pal = dict(ANSI16)
              lv = [0, 95, 135, 175, 215, 255]
              for r in range(6):
                  for g in range(6):
                      for b in range(6):
                          pal[16 + 36 * r + 6 * g + b] = (lv[r], lv[g], lv[b])
              for k in range(24):
                  v = 8 + 10 * k
                  pal[232 + k] = (v, v, v)
              return pal
          PAL256 = _pal256()
          SGR = re.compile(r"\x1b\[([0-9;]*)m")
          ANSI_ANY = re.compile(r"\x1b\[[0-9;?]*[A-Za-z]")
          def sgr_runs(line):
              # [(fg, bg, dim, text)]; fg/bg=(r,g,b)|None; dim=bool (SGR 2/22/0)
              fg = bg = None
              dim = False
              pos = 0
              out = []
              for m in SGR.finditer(line):
                  if m.start() > pos:
                      out.append((fg, bg, dim, line[pos:m.start()]))
                  params = [int(p) if p else 0 for p in m.group(1).split(";")] if m.group(1) else [0]
                  i = 0
                  while i < len(params):
                      p = params[i]
                      if p == 0:
                          fg = bg = None
                          dim = False
                      elif p == 2:
                          dim = True
                      elif p == 22:
                          dim = False
                      elif p in ANSI16:
                          fg = ANSI16[p]
                      elif p - 10 in ANSI16:
                          bg = ANSI16[p - 10]
                      elif p == 39:
                          fg = None
                      elif p == 49:
                          bg = None
                      elif p == 38 and i + 1 < len(params):
                          if params[i + 1] == 5 and i + 2 < len(params) and 0 <= params[i + 2] <= 255:
                              fg = PAL256[params[i + 2]]
                              i += 2
                          elif params[i + 1] == 2 and i + 4 < len(params):
                              rgb = tuple(params[i + 2:i + 5])
                              if all(0 <= v <= 255 for v in rgb):
                                  fg = rgb
                              i += 4
                      elif p == 48 and i + 1 < len(params):
                          if params[i + 1] == 5 and i + 2 < len(params) and 0 <= params[i + 2] <= 255:
                              bg = PAL256[params[i + 2]]
                              i += 2
                          elif params[i + 1] == 2 and i + 4 < len(params):
                              rgb = tuple(params[i + 2:i + 5])
                              if all(0 <= v <= 255 for v in rgb):
                                  bg = rgb
                              i += 4
                      i += 1
                  pos = m.end()
              if pos < len(line):
                  out.append((fg, bg, dim, line[pos:]))
              return out
          def lin(c):
              c = c / 255.0
              return c / 12.92 if c <= 0.04045 else ((c + 0.055) / 1.055) ** 2.4
          def contrast_vs_black(rgb):
              l = 0.2126 * lin(rgb[0]) + 0.7152 * lin(rgb[1]) + 0.0722 * lin(rgb[2])
              return (l + 0.05) / 0.05
          def hexrgb(rgb):
              return "#{:02x}{:02x}{:02x}".format(rgb[0], rgb[1], rgb[2])
          ITEM = re.compile(r"^\s*│\s*(❯\s*)?[a-z][a-z0-9_-]*\s")
          HDR = re.compile(r"commands · \d+ items")
          path = sys.argv[1]
          lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
          texts = [ANSI_ANY.sub("", l) for l in lines]
          hdr_idx = None
          for i, t in enumerate(texts):
              if HDR.search(t):
                  hdr_idx = i
                  break
          if hdr_idx is None:
              print("DETECTOR slash_menu_contrast: FAIL (menu_header_missing — слэш-меню не открылось, инфра)")
              sys.exit(2)
          # item-строки: блок внутри бокса после заголовка (│-строки);
          # item = командное слово [a-z]+ после │/❯ (рамка/сепараторы без
          # слов не считаются — приём e2_slash_menu golden)
          items = []
          for i in range(hdr_idx + 1, len(texts)):
              if not texts[i].strip().startswith("│"):
                  break
              if ITEM.match(texts[i]):
                  items.append(i)
          if not items:
              print("DETECTOR slash_menu_contrast: FAIL (menu_items_missing — пункты меню не отрендерились, инфра)")
              sys.exit(2)
          dim = 0
          lowc = 0
          ok = 0
          default_fg = 0
          fg_seen = []
          details = []
          for i in items:
              if "❯" in texts[i]:
                  continue
              for fg, bg, isdim, text in sgr_runs(lines[i]):
                  if not text.strip():
                      continue
                  if isdim:
                      dim += 1
                      fgh = hexrgb(fg) if fg else "default"
                      fg_seen.append(fgh)
                      details.append("  line={} item={!r} DIM fg={}".format(i + 1, text.strip()[:32], fgh))
                  elif fg is None:
                      default_fg += 1
                  else:
                      ratio = contrast_vs_black(fg)
                      if ratio < CONTRAST_MIN:
                          lowc += 1
                          fg_seen.append(hexrgb(fg))
                          details.append("  line={} item={!r} fg={} contrast={:.2f}:1 < {}:1".format(i + 1, text.strip()[:32], hexrgb(fg), ratio, CONTRAST_MIN))
                      else:
                          ok += 1
          unselected = sum(1 for i in items if "❯" not in texts[i])
          print("menu: header_line={} items={} unselected={} ok_runs={} default_fg_runs={}".format(hdr_idx + 1, len(items), unselected, ok, default_fg))
          for d in details[:12]:
              print(d)
          print("DETECTOR slash_menu_contrast: dim={} lowcontrast={} fg={} (невыделенные пункты: dim=SGR 2 на тексте; lowcontrast=fg против #000000 < {}:1 WCAG; RED: dim>0 ИЛИ lowcontrast>0)".format(
              dim, lowc, fg_seen[:8], CONTRAST_MIN))
          if ok + dim + lowc == 0 and default_fg > 0:
              print("  SKIP: все раны невыделенных пунктов с дефолтным fg — контраст против #000000 неизмерим (инфра)")
              sys.exit(2)
          sys.exit(0 if (dim == 0 and lowc == 0) else 1)
          PYEOF
          python3 $work/det-slash.py $slash/slash-51x23.ansi
        timeout: 120
        idempotent: true
        retry: 2
