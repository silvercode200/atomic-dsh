#       пишет ~60 fps; 0 = трейс мёртв → инфра exit 2) — гейт теперь
#       работает и в report-режиме trace-metrics.py;
#   (c) продукт-вердикт: --expect clean --forbid-sticky-off — sticky_off>0
#       = гейт 67 пропустил колесо (пила вернулась) = RED exit 1;
#       saw_flips>0 = RED как раньше. RED-якорь до 67 — юзер-трейс 24.09
#       20:56 UTC: sticky_off=46, saw_flips=10 (пары 42->39x10) — exit 1.
# Требование узла 6 → трассировка дословными терминами:
