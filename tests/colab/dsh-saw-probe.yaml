# suite_version: 7 (2026-09-26, TG-DSH-VISUAL-20260925 узел 6): контракт
# scroll_jitter приведён к INLINE-семантике. Root-cause golden68-run2
# (18/19, scroll_jitter — единственный фейл, exit 2 инфра): в inline вьюпорт
# ScrollBox = высоте контента (innerHeight=scrollHeight, maxScroll=0
# ВСЕГДА — контент утекает в скроллбек терминала, патч-модель inline),
# значит гейт 67 (maxScroll<=0 → visual no-op) обязан глотать ВСЕ wheel-
# инъекции: ноль кадров, ноль sticky_off, ноль пилы в окне. Прежний ассерт
# --require-sticky-off («скролл обязан сломать sticky») — FULLSCREEN-
# семантика (там вьюпорт ограничен панелью, maxScroll>0; golden68-run1
# fullscreen-реплика: sticky_off=67), в inline невыполним структурно →
# вечный инфра-фейл. Контракты v7 (валидированы локально тройным прогоном
# reports/scrolljitter-contract-v7-20260926/VALIDATION.md):
