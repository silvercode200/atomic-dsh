[06-retrybudget]
package=@deepseek-ai/dsh-llm-retry
rel_path=lib/index.js
patch=06-retrybudget.patch
backup=backup/dsh-llm-retry-index.js.orig
marker=dsh-patch-retrybudget begin
orig_md5=c9c6ae2225d654fedb7b1c78e21db248
comment=Wall-clock бюджет ретраев (TG-DSH-TUI-RETRY-20260917 node api-retry) — РЕГИСТРАЦИЯ ранее out-of-band патча. История: 16-17.09.2026 патч был применён вручную ТОЛЬКО к v22-глобали (маркер dsh-patch-retrybudget begin), v20-глобаль осталась престижной — дрейф копий, невидимый для манифеста. Регистрация синхронизирует v20: DSH_RETRY_BUDGET_MIN (минуты, >0) заменяет счётчик maxRetries wall-clock бюджетом от первого durable llm/retry события цепочки; cap задержки max(policy.maxDelayMs, DSH_RETRY_MAX_DELAY_MS=120s); AUTH не ретраится (фильтр retryableCodes раньше по коду); исчерпание — vanilla-путь (turn/end error); env отсутствует/0/битое — байт-идентичное vanilla поведение. СТЕК: 08-stream-closed-retryable применяется ПОВЕРХ этого патча (его orig_md5 = md5 пост-06-retrybudget состояния); revert идёт 08 -> 06-retrybudget -> престиж.

[07-max-tokens-auto-continue]
package=@deepseek-ai/dsh-agent-loop
rel_path=lib/index.js
patch=07-max-tokens-auto-continue.patch
backup=backup/agent-loop-index.js.orig
marker=dsh-overrides core 07: max-tokens auto-continue
orig_md5=1d583602e911ea80cb4d8b09cdae4521
comment=Авто-продолжение хода, обрезанного лимитом вывода (TG-DSH-REBUILD-20260921 волна 4 D-b). Сток: finish.kind "max-tokens" -> return {kind:"max-tokens"} — ход умирает молча, пользователь получает оборванный ответ без авто-продолжения. Патч: до DSH_TUI_MAX_TOKENS_CONTINUE продолжений на TURN (default 3; 0 = выключено = прежнее поведение; битое/отрицательное -> 0, не угадываем намерение) в inbox next-step кладётся синтетическое user-сообщение "continue" (createUserMessage, source=plugin "@deepseek-ai/dsh-agent-loop" — существующий "opaque content" путь MessageSourceMap, БЕЗ хардкода нового event-типа) и step() возвращает null — цикл хода продолжается через ту же механику, что у tool-результатов (inbox.append -> agent/inbox/spliced -> claim на следующем preStep -> user/message с surfaceOp append). Наблюдаемое событие agent/max-tokens-continue {turn, step, attempt} — durable, log-only (НЕ surface-eligible: без surfaceOp, как agent/inbox/spliced), бюджет считается по событиям текущего turn (переживает crash/replay; у субагентов своя сессия = свой бюджет). Ассемблер на max-tokens отбрасывает tool-call блоки (dsh-llm:931) — продолжение безопасно; guard message.content.length > 0 (пустое assistant-сообщение + user = 400 от API). Исчерпание бюджета / пустой контент / env=0 — прежний return {kind:"max-tokens"}. Abort/cancel не задет: signal.throwIfAborted между шагами; replay идемпотентен (неизвестные inbox-типы игнорируются фолдом). Цели: 2 nvm-глобали (v22.23.2 + v20.19.5, байт-в-байт идентичны, профильных копий dsh-agent-loop нет).

[08-stream-closed-retryable]
package=@deepseek-ai/dsh-llm-retry
rel_path=lib/index.js
patch=08-stream-closed-retryable.patch
backup=backup/dsh-llm-retry-index.js.pre08
marker=dsh-overrides core 08: stream-closed retryable
orig_md5=d86ec704f263a8d5b1d0236f0e7307d1
comment=STREAM_CLOSED ретраимый (TG-DSH-REBUILD-20260921 волна 4 D-b, тихий обрыв стрима). Сток: recover() гейтит код ошибки по policy.retryableCodes (DEFAULT_RETRYABLE_CODES = EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT), STREAM_CLOSED (событийный стрим оборвался без done/error — dsh-llm-pi-ai/lib/index.js:1571) не входит в список и молча убивал ход. Патч: одно условие — STREAM_CLOSED ретраится наравне с transport-классом; AUTH/INVALID_REQUEST и прочие коды не тронуты; бюджет/бэкофф/политика — общие с ядром (уважает 06-retrybudget). СТЕК: применяется поверх 06-retrybudget (orig_md5 = md5 пост-06-retrybudget состояния, backup .pre08 — пост-06-retrybudget снимок); revert 08 -> пост-06-retrybudget, затем 06-retrybudget -> престиж. Цели: 2 nvm-глобали (v22.23.2 несла out-of-band 06-retrybudget, v20 синхронизируется секцией 06-retrybudget при том же прогоне apply).
