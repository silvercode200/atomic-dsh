# manifest.conf — реестр core-патчей (dsh-overrides/core-patches).
#
# Патчуется СБОРКА пакета (lib/index.js), не исходники. Оригинал каждого файла
# хранится в backup/ (источник для --revert). Скрипт применения:
#   ../../scripts/apply-dsh-core-overrides.sh [--status|--revert]
#
# Формат: INI-секции [NN-name] с ключами:
#   package   — @scope/pkg (внутри node_modules пакета @deepseek-ai/dsh)
#   rel_path  — путь к файлу внутри пакета
#   patch     — .patch файл (unified diff, a/lib/index.js -> b/lib/index.js,
#               применяется patch -p1 из корня пакета)
#   backup    — оригинал в backup/ (+ sidecar .md5)
#   marker    — уникальная строка, появляющаяся в файле ТОЛЬКО после патча
#   orig_md5  — эталонный md5 НЕпатченого файла
#
# Дискавери целей в скрипте: глобальные копии во ВСЕХ nvm-версиях
# (node_modules внутри пакета @deepseek-ai/dsh, включая резолв через
# `realpath $(command -v dsh)` / DSH_CLI= из обёртки ~/.local/bin/dsh)
# + профильные ~/.dsh/profiles/*/.pnpm/@deepseek-ai+<pkg>@*/...
# (у 0.1.0-rc.8 профильные копии есть только у dsh-tools; dsh-tool-fs и
# dsh-code-runtime-worker-thread резолвятся из nvm-глобали — 2 цели).
#
# Стек патчей одного файла: 05 применяется ПОВЕРХ 01 (orig_md5 секции 05 —
# md5 ПОСТ-01 состояния, backup — пост-01 снимок). --revert идёт в обратном
# порядке секций (05 -> 01), иначе откат 01 затёр бы 05.

[01-toolargs-name]
package=@deepseek-ai/dsh-tools
rel_path=lib/index.js
patch=01-toolargs-name.patch
backup=backup/dsh-tools-index.js.orig
marker=dsh-overrides core 01: tool name in ToolArgsError
orig_md5=4bb603743c1245c86065a9bd36bc1a34
version_global=0.1.1-rc.2
version_profile=0.1.0-rc.8
comment=ToolArgsError называет инструмент (TG-DSH-INVAL-SUDO-20260910): dsh-агент сжёг 6 вызовов на "invalid arguments: missing required property \"description\"" — сообщение не называло инструмент (требовался description у run_code, агент правил внутренний tools.bash). Патч: ToolArgsError(violations, toolName), execute передаёт options.name из замыкания defineTool. Безымянные вызовы (прочие throw-сайты) сохраняют старый формат `invalid arguments: ...` — парсеры на старую подстроку не ломаются. ORIG_MD5 зафиксирован по факту всех целей 2026-09-10 (7 шт.: 2 nvm-глобали 0.1.1-rc.2 + 5 профильных 0.1.0-rc.8, байт-в-байт идентичны).

[02-fs-auto-observe]
package=@deepseek-ai/dsh-tool-fs
rel_path=lib/index.js
patch=02-fs-auto-observe.patch
backup=backup/dsh-tool-fs-index.js.orig
marker=dsh-overrides core 02: fs auto re-observe + one-shot retry
orig_md5=b6696d35941fc4dcd41fd61c20f38a67
comment=Авто re-observe + one-shot retry write/edit (TG-DSH-CLEAN-20260910 node 3, баг A-b). FS_NOT_OBSERVED (рестарт сессии/субагент — WeakMap наблюдений пуст) и FS_STALE_VERSION (внешняя правка, напр. собственный bash/gofmt агента) больше не валят инструмент: autoObserveTarget делает stat+readText теми же примитивами, что read-инструмент, эмитит fs/observed, затем ОДИН ретрай через waterfall (replaceIfVersion по свежей версии — CAS сохранён, конкурентный писатель фейлит ретрай, циклов нет). Бинарники честно отказывают (FS_NOT_TEXT), old_string-miss остаётся честной ошибкой, vanished+STALE -> createIfAbsent (no-clobber через link EEXIST). Результат с ретрая несёт note (optional в output-schema, before-контент в диффе): FS_NOT_OBSERVED -> "file was not previously read; original content in diff"; FS_STALE_VERSION -> "file changed since it was read; auto re-read, original content in diff". Цели: 2 nvm-глобали (v22.23.2 + v20.19.5, байт-в-байт идентичны, профильных копий нет — rc.8 не зависит от dsh-tool-fs).

[03-worker-cwd-retry]
package=@deepseek-ai/dsh-code-runtime-worker-thread
rel_path=lib/index.js
patch=03-worker-cwd-retry.patch
backup=backup/worker-thread-index.js.orig
marker=dsh-overrides core 03: dead-cwd (uv_cwd) worker spawn retry
orig_md5=5426a81632053bb14aac92556237c6f2
comment=Dead-cwd worker spawn retry (TG-DSH-CLEAN-20260910 node 3, баг A-a). 49% всех code-run фейлов: cwd хост-процесса на мёртвом SSHFS-маунте -> каждый new Worker() падает ENOENT/ENOTCONN uv_cwd -> все run_code мертвы до рестарта. У Worker нет опции cwd (наследует process.cwd()), поэтому: execute разбит на wrapper + executeOnce; при isDeadCwdWorkerExit (плюс guard на пустые logs — частичное выполнение не ретраится) — chdirToLiveDirectory (DSH_FALLBACK_CWD > $HOME > tmpdir > /) и ОДИН ретрай; восстановленный запуск штампуется ведущим log-entry "[dsh] session cwd was unavailable; process moved to <dir> — relative paths in run_code resolve there, not against the session cwd" (модель знает про смену cwd); повторный dead-cwd фейл или отсутствие живой директории -> actionable-ошибка "restart the session from a live directory". Первый воркер умирает ДО выполнения кода — двойного выполнения нет. Цели: 2 nvm-глобали (worker.cjs не трогается).

[04-todo-children]
package=@deepseek-ai/dsh-tool-todo
rel_path=lib/index.js
patch=04-todo-children.patch
backup=backup/dsh-tool-todo-index.js.orig
marker=dsh-overrides core 04: recursive todo children (depth <= 3)
orig_md5=16caff2fc6fcb873beee7e37da04c9e7
comment=Рекурсивные children у todo-элементов (TG-DSH-TODOTREE-20260911 node 1). Схема: необязательный children (array, та же форма элемента), генерируется todoItemSchema(depth) — свойство объявляется ТОЛЬКО на уровнях 1-2, глубже — path-qualified "not a declared property" на границе схемы (макс. дерево 3 уровня). normalize: рекурсивный toTodoList (trim, глобальная уникальность content по всему дереву — content = единственная идентичность тодо, на неё же анкерятся субагентские строки в TUI-патче 14; лимит in_progress считается по всему дереву; depth-guard для прямых вызовов). execute эхом возвращает дерево (output-schema та же рекурсивная форма). Zod-проекция todos: z.lazy-рекурсия — children больше НЕ стрипаются из wire-view (старая схема молча вырезала их при parse). description инструмента учит модели разбивать крупные задачи на подзадачи (глубина ≤3). Обратная совместимость: children опционален, старые плоские списки валидны без изменений; stateVersion 2 сохранён. Цели: 2 nvm-глобали (профильных копий dsh-tool-todo нет, verified find 2026-09-11).

[05-run-code-desc-optional]
package=@deepseek-ai/dsh-tools
rel_path=lib/index.js
patch=05-run-code-desc-optional.patch
backup=backup/dsh-tools-index.js.pre05
marker=dsh-overrides core 05: run_code description optional
orig_md5=7e44f53343e4f316f642464fe3baca8a
comment=run_code: параметр description необязателен (TG-DSH-RUNCODE-DESC-20260911). Инцидент: dsh-агент (deepseek) сжигал вызовы на "invalid arguments for run_code: missing required property \"description\"" — модель клала description внутрь code (для вложенного tools.bash), но не на верхний уровень run_code; после патча 01 имя инструмента в ошибке появилось, но вызовы всё равно сгорали. Рут-клюзия: description используется ТОЛЬКО презентационно (титул карточки в presentCall; проверка непустоты в execute — throw). Патч: (1) static parameters и динамический parameters-getter — у description убран ключ required (required:false НЕ поддерживается компилятором схемы: "parameters.description.required must be true when present" — опциональность = ОТСУТСТВИЕ ключа required); (2) execute — throw "invalid description: expected a non-empty string" убран; (3) presentCall — дефолтный титул: (args.description ?? "").trim() || "(no description)" (пустой/пробельный description тоже скатывается в дефолт, непустой сохраняется как есть). SDK_INSTRUCTIONS ("two required arguments") намеренно НЕ тронуты — мотивируют модель передавать description, когда она может. СТЕК: применяется поверх 01 к пост-01 состоянию; orig_md5 = md5 пост-01 файла; backup .pre05 — пост-01 снимок (revert 05 возвращает пост-01, затем revert 01 — престиж; скрипт ходит revert в обратном порядке секций). Репро: repro-runcode-desc.mjs (достаёт реальный run_code через ToolRuntime.prototype.requireCodeTransport на минимальном fake-this, БЕЗ патча пакета ради репро). Цели: те же 7, что у 01 (2 nvm-глобали 0.1.1-rc.2 + 5 профильных 0.1.0-rc.8, байт-в-байт идентичны).

