# Манифест тем dsh-tui, генерируемых из iTerm2-Color-Schemes (MIT).
# Поля: id (kebab-case, имя файла темы), displayName, base (dark|light),
# sourceFile (файл в sources/), family (семейство палитр).
# Замены против research-отбора (404/дубликаты в датасете):
#   Solarized Dark -> iTerm2 Solarized Dark; Solarized Light -> iTerm2 Solarized Light
#   Ayu Dark -> Ayu; One Dark (дубль Atom One Dark) -> Darkside
#   Synthwave 84 -> Synthwave; Eldritch -> Wombat; Nightfly -> Hybrid
#   Iceberg -> Iceberg Dark; Zenbones -> Zenbones Dark
